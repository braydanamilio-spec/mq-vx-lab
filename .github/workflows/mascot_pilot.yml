name: MM0 Mascot Pilot (5 kênh hoạt hình 2D — chạy tay)

# Vì sao TÁCH khỏi render_cron: rig nhân vật là tài sản DỰNG MỘT LẦN (~11 lượt vẽ/kênh). Làm việc
# đó trong lane render thì lane đầu gánh hết, 17 lane còn lại đợi; và nếu tạo hình chưa ưng thì đã
# lỡ tiêu quota. Ở đây: seed kênh (enabled=false) -> dựng rig -> render 1 short + 1 long để duyệt.
# Kênh chỉ vào matrix khi user bật `enabled` trên dashboard.

on:
  workflow_dispatch:
    inputs:
      buoc:
        description: "Bước cần chạy"
        type: choice
        required: true
        default: "rig+brand+pilot"
        options: ["seed", "rig", "brand", "pilot", "rig+brand+pilot", "seed+rig+brand+pilot"]
      kenh:
        description: "Kênh (EAGLEBANDIT · HANKYARD · PEARLPORCH · BISONDESK · OWLOFFICE)"
        required: false
        default: "EAGLEBANDIT"
      lam_lai_rig:
        description: "Vẽ lại rig dù đã có (CẨN THẬN: đổi tạo hình = đổi nhân vật)"
        type: boolean
        required: false
        default: false

concurrency: { group: mm0-mascot-pilot, cancel-in-progress: false }

permissions:
  contents: write        # để cất rig (ảnh nhân vật/bối cảnh) vào repo — xem bước "Cất rig vào repo"

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Checkout AutoPublisher (cho enqueue/Drive)
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.AUTOPUBLISHER_REPO }}
          token: ${{ secrets.AUTOPUBLISHER_TOKEN }}
          path: _autopublisher
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: "pip" }
      - name: Thư viện Python
        run: |
          # DANH SÁCH PHẢI KHỚP render_cron: thiếu `google-generativeai` thì selftest chặn ngay ở
          # dòng đầu ("Thiếu thư viện") — đúng cái đã làm hỏng lượt pilot 10:37Z.
          pip install --quiet -c render-pipeline/constraints.txt \
            google-generativeai edge-tts google-cloud-firestore \
            google-api-python-client google-auth google-auth-oauthlib \
            pyyaml cryptography requests
          pip install --quiet pillow          # BẮT BUỘC: tách nền chroma + cắt khung rig
          python -c "import importlib.metadata as m; print('📦 ' + ' · '.join(f'{p}={m.version(p)}' for p in ('google-generativeai','google-cloud-firestore','pillow')))"
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Cache node_modules
        id: cache-node
        uses: actions/cache@v4
        with:
          path: engine-remotion/node_modules
          key: node-modules-${{ hashFiles('engine-remotion/package-lock.json') }}
      - name: Cache Chrome Remotion
        uses: actions/cache@v4
        with:
          path: |
            ~/.remotion
            ~/.cache/remotion
          key: remotion-chrome-${{ hashFiles('engine-remotion/package-lock.json') }}
      - name: Thư viện hệ thống
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64 \
            libpango-1.0-0 libcairo2 libatspi2.0-0 || sudo apt-get install -y ffmpeg libasound2
      - name: npm ci (chỉ khi cache MISS)
        if: steps.cache-node.outputs.cache-hit != 'true'
        working-directory: engine-remotion
        run: npm ci
      - name: Ensure Chrome
        working-directory: engine-remotion
        run: npx remotion browser ensure
      - name: Ghi service account key
        run: |
          echo '${{ secrets.GCP_SA_KEY }}' > /tmp/sa.json
          echo '${{ secrets.GCP_SA_KEY_B }}' > /tmp/sa_b.json
          echo '${{ secrets.GCP_SA_KEY_C }}' > /tmp/sa_c.json
      - name: SEED / RIG / PILOT
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          GOOGLE_APPLICATION_CREDENTIALS_B: /tmp/sa_b.json
          FIREBASE_PROJECT_ID_B: ${{ secrets.FIREBASE_PROJECT_ID_B }}
          GOOGLE_APPLICATION_CREDENTIALS_C: /tmp/sa_c.json
          FIREBASE_PROJECT_ID_C: ${{ secrets.FIREBASE_PROJECT_ID_C }}
          FIREBASE_PROJECT_ID_B2: mm0-shard-b2
          SHARD_META: ${{ vars.SHARD_META }}
          SHARD_KEYS: ${{ vars.SHARD_KEYS }}
          OWNER_UID: ${{ secrets.OWNER_UID }}
          HOT_KEY: ${{ secrets.HOT_KEY }}
          HOT_MODE: "on"
          AUTOPUBLISHER_SRC: ${{ github.workspace }}/_autopublisher/src
          GEMINI_SYSTEM_PROMPT: ${{ secrets.GEMINI_SYSTEM_PROMPT }}
          PIPELINE_VERSION: "mascot-v1"
          BUOC: ${{ github.event.inputs.buoc }}
          KENH: ${{ github.event.inputs.kenh }}
          LAM_LAI: ${{ github.event.inputs.lam_lai_rig }}
        run: |
          set -e
          cd render-pipeline
          python selftest.py
          RIG_ARGS=$([ "$LAM_LAI" = "true" ] && echo --lam-lai)
          case "$BUOC" in
            seed)   python mascot_pilot.py --seed ;;
            rig)    python mascot_pilot.py --rig "$KENH" $RIG_ARGS ;;
            brand)  python mascot_brand.py --kenh "$KENH" ;;
            pilot)  python mascot_pilot.py --pilot "$KENH" ;;
            "rig+brand+pilot")
                    python mascot_pilot.py --rig "$KENH" $RIG_ARGS
                    python mascot_brand.py --kenh "$KENH"
                    python mascot_pilot.py --pilot "$KENH" ;;
            *)      python mascot_pilot.py --seed
                    python mascot_pilot.py --rig "$KENH" $RIG_ARGS
                    python mascot_brand.py --kenh "$KENH"
                    python mascot_pilot.py --pilot "$KENH" ;;
          esac
      # RIG PHẢI VÀO REPO — 25/8: lượt 11:16Z chết với "rig nhân vật chưa dựng" dù lượt trước vừa
      # dựng đủ 12/12 tư thế. Lý do: rig nằm trong ổ đĩa của runner, hết job là mất; lượt sau
      # checkout sạch nên không thấy gì. Rig là TÀI SẢN NHẬN DIỆN của kênh (như logo), vẽ một lần
      # dùng mãi — chỗ đúng của nó là trong repo, không phải thư mục tạm. Vào repo rồi thì mọi
      # lane render đều có sẵn, khỏi vẽ lại, khỏi trôi.
      - name: Cất rig vào repo (vẽ một lần, dùng mãi)
        if: always()
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name  "mm0-bot"
          git config user.email "bot@mm0.local"
          git add -f engine-remotion/public/mascots engine-remotion/public/stages \
                     engine-remotion/public/brand 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "ℹ️ rig không đổi — khỏi commit."
          else
            N=$(git diff --cached --name-only | wc -l | tr -d ' ')
            git commit -q -m "Rig + brandkit ${KENH:-mascot}: $N tệp (vẽ một lần, dùng mãi)"
            git pull --rebase -q origin main || true
            git push -q origin HEAD:main && echo "✅ đã cất $N tệp rig vào repo"
          fi
        env:
          KENH: ${{ github.event.inputs.kenh }}
      # Rig + video giữ lại để XEM TẬN MẮT trước khi duyệt (Drive có thể chưa kịp/lỗi quota).
      - name: Giữ rig + video pilot để duyệt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mascot-${{ github.event.inputs.kenh }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            engine-remotion/public/mascots/**
            engine-remotion/public/stages/**
            engine-remotion/public/brand/**
            render-pipeline/out/*.mp4
