name: MM0 Publish YouTube (public runner)

# ĐĂNG YOUTUBE chạy trên REPO PUBLIC = phút Actions KHÔNG giới hạn (free vĩnh viễn).
# Code đăng nằm ở repo PRIVATE mm0-auto-publisher -> checkout lúc chạy (code vẫn KÍN).
# Credential đọc từ Firestore connections (kết nối qua dashboard). Chỉ cần SA + project.

on:
  schedule:
    # ── NHỊP CRON PHẢI KHỚP NĂNG LỰC ĐĂNG, KHÔNG KHỚP CẢM GIÁC "CÀNG DÀY CÀNG TỐT" (4/9/2026)
    #
    # Anh: *"suốt ngày bị cạn quota."* Đo lại đường đăng thì đây là chỗ tiêu ĐỀU ĐẶN nhất hệ,
    # và nó tiêu vì tần suất chứ không vì một lỗi:
    #
    #     mỗi lượt cron đọc:  yt_queue (tới 2.000 mục) + render_jobs done/chưa-xếp (300)
    #     48 lượt/ngày     ->  hàng đợi 600 mục đã là ~43.000 lượt ĐỌC/ngày
    #     trần cả ngày     ->  50.000
    #
    # Tức đường đăng một mình có thể ăn gần trọn hạn mức, và nó làm việc ấy MỖI NGÀY — khớp
    # đúng điều anh mô tả. Và hàng đợi chỉ phình: YouTube giữ ~6 video/kênh/ngày (18 kênh
    # ≈ 108/ngày) trong khi dây chuyền dựng ~450/lượt, nên chi phí tăng tuyến tính mãi mãi.
    #
    # Chạy 30 phút một lần để đăng ~6 video mỗi kênh mỗi ngày là kiểm 48 lần cho một việc xảy
    # ra vài lần. Hai giờ một lần vẫn dày hơn nhu cầu (12 lượt cho ~6 lần đăng), mà cắt thẳng
    # 4× lượt đọc. Item lỡ giờ không mất: `publish_yt_queue` có catch-up cho cron trễ.
    - cron: "5 */2 * * *"   # mỗi 2 giờ (12 lượt/ngày) — xem lý do ở trên
  workflow_dispatch:
    inputs:
      dry_run: { description: "Chạy thử (không upload)", type: boolean, default: false }

concurrency: { group: mm0-publisher, cancel-in-progress: false }

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout AutoPublisher (private)
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.AUTOPUBLISHER_REPO }}
          token: ${{ secrets.AUTOPUBLISHER_TOKEN }}
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: "pip" }
      - run: pip install -r requirements.txt
      - name: Ghi service account key (A + B + C)
        run: |
          echo '${{ secrets.GCP_SA_KEY }}' > /tmp/sa.json
          echo '${{ secrets.GCP_SA_KEY_B }}' > /tmp/sa_b.json   # render_jobs -> Project B
          echo '${{ secrets.GCP_SA_KEY_C }}' > /tmp/sa_c.json   # publish owned -> Project C
      - name: Chạy publisher
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          # 26/8 — sổ đo lượt Firestore của publish/thumbnail/health-guardian xả về D1 qua
          # HOT_KEY. Thiếu biến này thì sổ vẫn đếm nhưng không ai đọc được — mà 100 lượt
          # chạy/ngày của nhóm này chính là ~52% trần Firestore chưa từng được nhìn.
          HOT_KEY: ${{ secrets.HOT_KEY }}
          HOT_MODE: on
          GOOGLE_APPLICATION_CREDENTIALS_B: /tmp/sa_b.json
          FIREBASE_PROJECT_ID_B: ${{ secrets.FIREBASE_PROJECT_ID_B }}
          GOOGLE_APPLICATION_CREDENTIALS_C: /tmp/sa_c.json
          FIREBASE_PROJECT_ID_C: ${{ secrets.FIREBASE_PROJECT_ID_C }}
          SHARD_PUBLISH: ${{ vars.SHARD_PUBLISH }}   # publish owned (videos/counters/quota/queues) -> Project C
          POSTING_TEMPLATE: ${{ vars.POSTING_TEMPLATE || 'growth_30d' }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python src/main.py --dry-run
          else
            python src/main.py
          fi
