# ══════════════════════════════════════════════════════════════════════════════════════════
# DỌN SỔ KHO — đưa con số trên dashboard về ĐÚNG SỰ THẬT  (1/9/2026)
#
# Anh: *"Video trong kho 2088 sao ko fix triệt để, kho đã xoá hết rồi."* và ảnh chụp ô xổ
# "Tất cả kênh (2088)" vẫn liệt kê đủ 50 kênh cũ.
#
# ── HAI KHO SONG SONG, PHẢI ĐỤNG CẢ HAI ──────────────────────────────────────────────────
#   Firestore `render_channels` / `render_jobs`  -> cấu hình kênh + lịch sử job
#   D1 `render_job`                              -> thứ dashboard ĐỌC để đếm và đổ ô xổ
# Dọn một kho rồi báo xong là lỗi đã mắc: `render_channels` còn 18 kênh mới, mà ô xổ vẫn hiện
# 50 kênh cũ vì nó đọc kho kia.
#
# ── VÌ SAO TÁCH RA MỘT WORKFLOW RIÊNG ────────────────────────────────────────────────────
# Hai bước này đã nằm trong luồng render hằng ngày (luồng 1) nên số sẽ tự đúng mỗi ngày. Tệp
# này để BẤM TAY khi cần đúng NGAY, mà không phải chạy cả 18 luồng dựng video — nó chỉ tốn
# vài chục giây và không đụng một lượt render nào.
#
# KHÔNG có `schedule:` — cố ý. Việc định kỳ đã do luồng render lo; thêm cron ở đây là hai chỗ
# cùng làm một việc, và sớm muộn chúng đá nhau.
# ══════════════════════════════════════════════════════════════════════════════════════════
name: Dọn sổ kho (Firestore + D1)

on:
  workflow_dispatch:

jobs:
  don:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Checkout repo đăng bài
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.AUTOPUBLISHER_REPO }}
          token: ${{ secrets.AUTOPUBLISHER_TOKEN }}
          path: _autopublisher
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: Cài đặt
        run: |
          pip install --quiet pyyaml requests
          # GHIM PHIÊN BẢN Ở CẢ HAI NHÁNH. Nhánh dự phòng cũ cài BẢN MỚI NHẤT, và
          # `2>/dev/null` nuốt luôn lý do requirements.txt hỏng. Chính cái đó đã đưa vào
          # một bản `google-cloud-firestore` khác pin, làm `.where()` truyền vị trí đổi
          # hành vi — pin tồn tại ĐÚNG để chặn việc ấy, mà nhánh dự phòng lại vứt nó đi.
          pip install --quiet -r _autopublisher/requirements.txt || \
            pip install --quiet 'google-api-python-client>=2.120,<3' 'google-auth>=2.29,<3' 'google-cloud-firestore>=2.27,<2.29' 'google-api-core>=2.30,<2.35' 'PyYAML>=6.0,<7'

      # MỘT LƯỢT DUY NHẤT, không chạy thử rồi chạy thật.
      # `don_sach.py` in kiểm kê đầy đủ trước khi xoá, nên bước thử riêng chỉ nhân đôi
      # chi phí đọc Firestore — và chính chi phí ấy đã làm cạn hạn mức hôm nay.
      - name: Dọn (in kiểm kê rồi xoá)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          OWNER_UID: ${{ secrets.OWNER_UID }}
          HOT_KEY: ${{ secrets.HOT_KEY }}
          CHANNELS_YAML: ${{ github.workspace }}/_autopublisher/config/channels.yaml
        run: |
          # Ghi khoá dịch vụ Ở ĐÂY. Bản trước nó nằm trong bước chạy thử; bỏ bước ấy đi thì
          # `/tmp/sa.json` không còn ai tạo, và bước đối chiếu Drive chết vì thiếu tệp —
          # gỡ một bước là mất luôn thứ nó dọn đường cho bước sau.
          echo '${{ secrets.GCP_SA_KEY }}' > /tmp/sa.json
          cd render-pipeline && python don_sach.py --that --owner "$OWNER_UID"

      # Đối chiếu với Drive SAU khi dọn: `kho_that` là thứ `apiHotStat` ưu tiên hơn số đếm bản
      # ghi, nhưng chỉ khi nó mới hơn 26 giờ. Không chạy bước này thì số vẫn rơi về đếm bản ghi.
      # ── DÒ ĐƯỜNG LẤY HỒ KHO  (1/9/2026) ────────────────────────────────────────────────
      # Tôi đã KẾT LUẬN "KV rỗng" chỉ vì log thiếu một dòng in — chưa bao giờ hỏi thẳng. Đó là
      # suy đoán, và nó dẫn tới câu trả lời "chờ tới mai", trong khi có thể đang có đường đi được.
      # Bước này hỏi TỪNG tầng và in ra tầng nào trả lời được. Vài giây, không tốn hạn mức
      # Firestore ở hai tầng đầu.
      - name: Dò đường lấy hồ kho (KV / D1 / Firestore)
        if: always()
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          OWNER_UID: ${{ secrets.OWNER_UID }}
          HOT_KEY: ${{ secrets.HOT_KEY }}
        run: |
          cd _autopublisher/src
          python - <<'PYEOF'
          import sys, os
          sys.path.insert(0, ".")
          import storage as ST
          print("── DÒ TỪNG TẦNG ──")
          try:
              ST._POOL_CACHE["val"] = None   # xoá đệm để đo TẦNG chứ không đo đệm
              kv = ST._kho_tu_kv()
              print(f"  KV        : {len(kv)} tài khoản")
          except Exception as e:
              print(f"  KV        : lỗi {type(e).__name__}: {str(e)[:70]}")
          try:
              d1 = ST._kho_tu_d1()
              print(f"  D1        : {len(d1)} tài khoản")
          except Exception as e:
              print(f"  D1        : lỗi {type(e).__name__}: {str(e)[:70]}")
          try:
              ho = ST.pool_accounts()
              print(f"  TỔNG HỢP  : {len(ho)} tài khoản  -> {'ĐẨY ĐƯỢC NGAY' if ho else 'CHƯA đẩy được'}")
          except Exception as e:
              print(f"  TỔNG HỢP  : lỗi {type(e).__name__}: {str(e)[:90]}")
          PYEOF

      # ── BẬT ĐĂNG TỰ ĐỘNG CHO 18 KÊNH (ghi D1, không đụng Firestore) ────────────────────
      # Anh: *"cứ setup tự động đầy đủ, sau gắn channel vô là nó tự động ăn khớp"*.
      # Idempotent: chạy lại chỉ ghi đè cùng một cấu hình, không đẻ thêm gì.
      # Chốt an toàn giữ nguyên — kênh chưa nối YouTube thì `auto_enqueue` bỏ qua và in lý do,
      # nên bật sẵn không làm đăng nhầm; nó chỉ khiến kênh sẵn sàng đúng lúc anh nối xong.
      - name: Bật đăng tự động cho 18 kênh
        env:
          OWNER_UID: ${{ secrets.OWNER_UID }}
          HOT_KEY: ${{ secrets.HOT_KEY }}
        run: cd render-pipeline && python bat_dang.py --that

      - name: Đối chiếu số kho với Drive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          OWNER_UID: ${{ secrets.OWNER_UID }}
          HOT_KEY: ${{ secrets.HOT_KEY }}
        # `|| true`: đối chiếu Drive cần Firestore; cạn hạn mức thì bước này hỏng, nhưng
        # phần dọn D1 ở trên ĐÃ xong. Cho cả lượt đỏ vì một bước phụ là báo sai việc đã làm được.
        run: cd render-pipeline && python kiem_kho.py --ghi --owner "$OWNER_UID" || true
