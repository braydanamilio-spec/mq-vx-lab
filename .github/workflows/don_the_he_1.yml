name: MM0 — Dọn 55 kênh thế hệ 1

# CHẠY TAY, MẶC ĐỊNH CHỈ ĐẾM. Ba lớp tách riêng để làm từng bước và dừng được giữa chừng.
# Kho Drive: chuyển vào THÙNG RÁC (giữ 30 ngày), KHÔNG xoá vĩnh viễn. Đổ thùng rác là việc
# người chủ tự bấm trong Drive — script này cố ý không có đường làm chuyện đó.
on:
  workflow_dispatch:
    inputs:
      lam_that:
        description: "1 = làm thật; 0 = chỉ đếm"
        default: "0"
      tat_kenh:
        description: "1 = tắt 55 kênh cũ (đảo ngược được — làm bước này trước)"
        default: "0"
      don_kho:
        description: "1 = đưa video/thumbnail kênh cũ vào thùng rác Drive"
        default: "0"
      don_ban_ghi:
        description: "1 = xoá bản ghi kênh cũ trong render_channels (làm SAU CÙNG)"
        default: "0"
      don_job:
        description: "1 = xoá job kênh cũ khỏi render_jobs (Kho tổng video trên dashboard)"
        default: "0"
      tha_de_tai:
        description: "1 = THẢ sổ đề tài của các kênh được dọn, để chúng được LÀM LẠI (chỉ dùng cùng gen2). Kịch bản trên Drive giữ nguyên."
        default: "0"
      gen2:
        description: "1 = ĐỔI ĐÍCH sang 50 kênh THẾ HỆ 2 (dọn video làm lại từ đầu). Giữ nguyên kịch bản, brand kit, cấu hình kênh, sổ chủ đề. KHÔNG dùng chung với don_ban_ghi."
        default: "0"
      chi_kenh:
        description: "CHỈ dọn các kênh này (cách nhau bằng dấu phẩy, vd: AMERICALOOKEDUP,PENTAGONLEDGER). Để trống = cả 50. BẮT BUỘC đi cùng gen2=1."
        default: ""
      # 29/8 — dọn theo MỐC THỜI GIAN, mọi kênh. Ô "Video trong kho" trên bảng đếm FILE TRÊN
      # DRIVE, nên đánh dấu job bao nhiêu nó cũng không giảm; muốn giảm thì phải đụng file thật.
      # Chỉ .mp4/.jpg vào thùng rác; sidecar .json chứa KỊCH BẢN thì tuyệt đối giữ.
      don_kho_cu:
        description: "1 = đưa VIDEO dựng TRƯỚC mốc vào thùng rác (mọi kênh). Giữ nguyên sidecar kịch bản."
        default: "0"
      truoc:
        description: "Mốc cho don_kho_cu (ISO-8601 UTC). Mặc định 2026-08-29T10:30:00Z = lúc engine đạt chuẩn."
        default: "2026-08-29T10:30:00Z"

jobs:
  don:
    runs-on: ubuntu-latest
    # 26/8 — 45 phút KHÔNG ĐỦ: 9.037 tệp xoá tuần tự mất đúng 45'21" rồi bị giết giữa chừng.
    # Nay xoá song song 8 luồng nên nhanh hơn nhiều, nhưng vẫn nới trần phòng kho phình thêm.
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Deps
          # 26/8 — DANH SÁCH NÀY PHẢI ĐỦ NHƯ `render_cron`, vì bước sau chạy `selftest.py`
          # và selftest có chốt đọc file YAML của workflow. Thiếu `pyyaml` là selftest
          # KHÔNG chạy nổi rồi thoát mã 1 ⇒ chặn luôn cả việc chính, dù việc chính không
          # cần thư viện đó. Lần seed 07:01Z hôm nay chết đúng kiểu này: `❌ step trỏ
          # Project C phải bật SHARD_PUBLISH: No module named 'yaml'`.
          # 07:10Z — lần vá đầu nới danh sách quá tay (thêm cả generativeai/edge-tts/
          # oauthlib) và pip chết vì `resolution-too-deep`; lần sau cắt còn pyyaml thì
          # lại thiếu `google-generativeai`. Kết luận: DÙNG ĐÚNG BỘ CỦA `render_cron`,
          # bộ đó ngày nào cũng chạy nên chắc chắn pip giải được. Đừng tự chế bộ khác.
        run: pip install --quiet -c render-pipeline/constraints.txt google-generativeai edge-tts google-cloud-firestore google-api-python-client google-auth pyyaml cryptography google-auth-oauthlib
      - name: Khoá dịch vụ
        run: |
          echo '${{ secrets.GCP_SA_KEY_B }}' > /tmp/sa_b.json
          echo '${{ secrets.GCP_SA_KEY }}'   > /tmp/sa.json
          # 28/8 — project C (nơi để `videos`, thứ dashboard đếm). Trỏ env vào tệp mà không tạo
          # tệp thì `_db_pub()` trả None và bước dọn ném NoneType — im lặng với người đọc log.
          echo '${{ secrets.GCP_SA_KEY_C }}' > /tmp/sa_c.json
      # 26/8 — BƯỚC NÀY TỪNG HỎNG TRONG IM LẶNG. Nó `cp -r MM0-AutoPublisher/src` nhưng đó là
      # repo RIÊNG, không có trong checkout của repo render ⇒ `cp` trượt, `|| true` nuốt lỗi, rồi
      # `don_the_he_1.py` chết `No module named 'storage'` — tức bản dọn KHÔNG BAO GIỜ chạy được.
      # Đúng cái bẫy đã ghi cho `render_cron` ngày 24/8 (`backup_vault` chết mọi phiên vì y hệt).
      # Nay checkout repo thật, như `render_cron` vẫn làm.
      - uses: actions/checkout@v4
        with:
          repository: ${{ secrets.AUTOPUBLISHER_REPO }}
          token: ${{ secrets.AUTOPUBLISHER_TOKEN }}
          path: _autopublisher
      - name: Dọn
        env:
          GOOGLE_APPLICATION_CREDENTIALS:   /tmp/sa.json
          FIREBASE_PROJECT_ID:              ${{ secrets.FIREBASE_PROJECT_ID }}
          GOOGLE_APPLICATION_CREDENTIALS_B: /tmp/sa_b.json
          FIREBASE_PROJECT_ID_B:            ${{ secrets.FIREBASE_PROJECT_ID_B }}
          # Gương B2: đúng lúc B cạn hạn mức là lúc cần thao tác quản trị nhất,
          # nên công cụ quản trị phải lật được sang gương như dây chuyền chính.
          FIREBASE_PROJECT_ID_B2: mm0-shard-b2
          # 28/8 — THIẾU HAI DÒNG NÀY LÀ KHÔNG DỌN ĐƯỢC `videos`. Bảng đó nằm ở project C khi bật
          # SHARD_PUBLISH; cờ đã truyền từ trước nhưng KHOÁ thì chưa, nên `_db_pub()` trả None và
          # bước dọn ném "'NoneType' object has no attribute 'collection'".
          # Cùng lớp lỗi đã gặp ở render lane 25/8: truyền cờ mà quên truyền khoá.
          GOOGLE_APPLICATION_CREDENTIALS_C: /tmp/sa_c.json
          FIREBASE_PROJECT_ID_C:            ${{ secrets.FIREBASE_PROJECT_ID_C }}
          OWNER_UID:                        ${{ secrets.OWNER_UID }}
          AUTOPUBLISHER_SRC:                ${{ github.workspace }}/_autopublisher/src
          # storage.py cần HOT_KEY để dùng lớp cứu KV khi Firestore cạn hạn mức —
          # thiếu là bước dọn kho đứng im đúng lúc quota hết (chốt selftest bắt).
          HOT_KEY:                          ${{ secrets.HOT_KEY }}
          HOT_MODE:                         on
          # 26/8 — THIẾU CỜ NÀY LÀ ĐỌC SAI PROJECT. `_db_meta()` chỉ trỏ vào B khi SHARD_META=1;
          # không có cờ thì về A, nơi `render_channels` rỗng ⇒ bản dọn không thấy kênh cũ nào và
          # báo "dọn 0 tệp" như thể thành công. Cùng lỗi vừa vá ở `seed_the_he_2`.
          SHARD_META:                       ${{ vars.SHARD_META }}
          SHARD_KEYS:                       ${{ vars.SHARD_KEYS }}
          SHARD_PUBLISH:                    ${{ vars.SHARD_PUBLISH }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.lam_that }}"    = "1" ]; then ARGS="$ARGS --that"; fi
          if [ "${{ github.event.inputs.tat_kenh }}"    = "1" ]; then ARGS="$ARGS --tat"; fi
          if [ "${{ github.event.inputs.don_kho }}"     = "1" ]; then ARGS="$ARGS --kho"; fi
          if [ "${{ github.event.inputs.don_ban_ghi }}" = "1" ]; then ARGS="$ARGS --ban-ghi"; fi
          if [ "${{ github.event.inputs.don_job }}"     = "1" ]; then ARGS="$ARGS --job"; fi
          if [ "${{ github.event.inputs.gen2 }}"        = "1" ]; then ARGS="$ARGS --gen2"; fi
          if [ "${{ github.event.inputs.tha_de_tai }}"  = "1" ]; then ARGS="$ARGS --tha-de-tai"; fi
          if [ "${{ github.event.inputs.don_kho_cu }}"  = "1" ]; then ARGS="$ARGS --kho-cu --truoc ${{ github.event.inputs.truoc }}"; fi
          export CHI_KENH="${{ github.event.inputs.chi_kenh }}"
          python render-pipeline/don_the_he_1.py $ARGS
          # 29/8 — ĐẾM LẠI KHO NGAY SAU KHI DỌN.
          # Anh: "e kêu 45p dọn sạch kho... mà sao vẫn còn". Kho ĐÃ sạch — 7.800 tệp vào thùng
          # rác, lượt chạy báo success. Nhưng ô "Video trong kho" đọc bảng `kho_that`, thứ chỉ
          # được đếm lại MỘT LẦN MỖI NGÀY và còn bị một cờ nghỉ 20 giờ khoá lại. Nên sau khi dọn
          # xong, con số trên bảng vẫn là ảnh chụp CŨ — nhìn y như chưa dọn gì.
          # Dọn xong mà không đếm lại thì với người vận hành, việc dọn ấy chưa từng xảy ra.
          if [ "${{ github.event.inputs.lam_that }}" = "1" ]; then
            echo "── đếm lại kho sau khi dọn ──"
            RENDER_OWNER="$OWNER_UID" python render-pipeline/kiem_kho.py --ghi || true
          fi
