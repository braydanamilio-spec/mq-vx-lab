name: MM0 Health Guardian (canh hệ thống mỗi giờ)

# Thay việc phải tự check tay mỗi giờ: chạy 24/7 dù máy tắt / không ai mở dashboard.
#   1. Tự chữa job render bị "treo" (>6h không xong) -> mở lại cổng render nếu đang bị kẹt.
#   2. Nếu 12h liền không có video nào xong dù render đang bật -> workflow FAIL -> GitHub TỰ GỬI EMAIL
#      báo lỗi cho chủ repo (tính năng free có sẵn, không cần dịch vụ thông báo nào khác).
# Secrets: GCP_SA_KEY, FIREBASE_PROJECT_ID, GCP_SA_KEY_B, FIREBASE_PROJECT_ID_B, OWNER_UID (đã có sẵn).

on:
  schedule:
    - cron: "7 * * * *"   # mỗi giờ, phút 07 (lệch nhịp render_cron để đỡ chồng burst đọc Firestore)
  workflow_dispatch:
    inputs:
      stale_hours: { description: "Ngưỡng coi job là treo (giờ) — để trống dùng mặc định 6", default: "" }

concurrency: { group: mm0-health-guardian, cancel-in-progress: false }

jobs:
  guardian:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install --quiet "google-cloud-firestore>=2.27,<3" "google-api-core>=2.30,<3" "grpcio>=1.70,<2"
      - name: Service account file
        run: |
          echo '${{ secrets.GCP_SA_KEY }}' > /tmp/sa.json
          echo '${{ secrets.GCP_SA_KEY_B }}' > /tmp/sa_b.json
      # ── CANH CRON RENDER: NỔ THAY KHI MỐC CỦA NÓ KHÔNG NỔ  (2/9/2026) ───────────────────
      # Anh: *"mẹ sao 10h rồi ko làm gì."* Đo được: `render_giai_thich_18.yml` có bốn mốc
      # 08:20–11:20 UTC, cả bốn đã qua, **không mốc nào nổ**. Hỏi API theo id workflow thì MỌI
      # lượt của nó từ lúc tạo đều là `workflow_dispatch` — cron ấy chưa từng nổ một lần nào.
      #
      # Ba điều kiện của luật §10.2 đều ĐỦ: workflow `active` · cron có trên `main` · workflow
      # khác cùng repo vẫn nổ đều (Publish, Stats, Cleanup, chính Guardian này). Nên đây không
      # phải lỗi cấu hình để đi sửa — đây là hạ tầng cron của repo bỏ tick, ở mức 100%.
      #
      # Không sửa được thứ mình không điều khiển, nhưng KHÔNG ĐƯỢC phụ thuộc vào nó. Guardian nổ
      # đều mỗi giờ nên nó làm mốc thay: hỏi 20h qua có lượt render nào DỰNG THẬT chưa, chưa thì
      # tự bấm.
      #
      # "DỰNG THẬT", không phải "kết luận success" — buglog 7bv: một lượt bị cổng `chot` bỏ qua
      # cũng kết thúc `success` (job `dung` chỉ `skipped`, mà `skipped` không làm hỏng lượt), nên
      # đếm `success` là mỗi lượt bỏ qua lại làm mới dấu thành công và cửa sổ không bao giờ trôi.
      - name: Canh cron render (nổ thay khi mốc của nó không nổ)
        env:
          # PAT, KHÔNG phải GITHUB_TOKEN. GitHub cố ý chặn: lượt chạy do `GITHUB_TOKEN` kích sẽ
          # KHÔNG tạo workflow run mới (luật chống đệ quy). Dùng nó ở đây thì lệnh trả 204 như
          # thành công mà chẳng có lượt nào sinh ra — tức lại một cái "xanh mà không làm gì",
          # đúng họ lỗi đã tốn cả ngày hôm qua. Nên phải là PAT, và phải KIỂM LẠI sau khi bấm.
          GH_TOKEN: ${{ secrets.AUTOPUBLISHER_TOKEN }}
        run: |
          # ── TỰ TÌM LUỒNG RENDER ĐANG BẬT, ĐỪNG GHI CỨNG MỘT CÁI TÊN  (8/9/2026) ────────
          # Anh bảo bật browser kiểm. Dashboard hiện 0 và guardian xác nhận "không video nào
          # xong trong 12h" — đúng, nhưng gốc thì nằm ở ĐÂY, không ở dashboard.
          #
          # Bước này ghi cứng `WF="render_giai_thich_18.yml"`, mà luồng ấy đã TẮT có chủ đích
          # từ lâu. Nên mỗi giờ guardian đọc trạng thái, thấy `disabled_manually`, và bỏ qua —
          # đúng luật §17.13. Trong khi HAI luồng đang chạy thật (`render_comic_18.yml` và
          # `render_phim_18.yml`) thì KHÔNG AI canh. Cron của repo này nổ trễ và thất thường
          # (§10.2, đo được: khai 08:20 mà nổ 14:18), nên đúng lúc cần cái canh gác nhất thì
          # nó đang canh một cánh cửa đã khoá.
          #
          # Đo hậu quả: 07:40 · 08:20 · 08:40 · 09:20 đều trôi qua, không lượt render nào, và
          # lượt gần nhất là 10,5 giờ trước. §15.25 — cơ chế ĐÚNG gắn vào chỗ SAI; §13.2 —
          # cổng phải TỰ TÌM phạm vi của nó, đừng cầm danh sách chép tay.
          DS=$(gh api "repos/${{ github.repository }}/actions/workflows?per_page=100" \
                 --jq '.workflows[] | select(.state=="active") | select(.path|test("workflows/render_.*\\.yml$")) | .path' \
               2>/dev/null | sed 's#.*/##' || echo "")
          if [ -z "$DS" ]; then
            echo "   ⏸ không có luồng render nào đang BẬT — không bấm thay."
            exit 0
          fi
          echo "   🔎 luồng render đang bật: $(echo $DS | tr '\n' ' ')"
          LOI=0
          for WF in $DS; do
          # ── HỎI LẠI TRẠNG THÁI TỪNG LUỒNG, DÙ KHÂU TÌM ĐÃ LỌC `active`  ────────────────
          # Phép tìm ở trên đã `select(.state=="active")`, nên về lý thì thừa. Giữ vì đây là
          # thứ bảo vệ CÔNG TẮC TẮT của người vận hành (§17.13): anh tắt một luồng để dừng
          # render, và một hệ tự động không được phép đi ngược quyết định ấy. Một lớp phòng
          # thủ nữa tốn đúng một lệnh API mỗi giờ, và nó sống sót cả khi ai đó sửa khâu tìm.
          TT=$(gh api "repos/${{ github.repository }}/actions/workflows/$WF" --jq '.state' 2>/dev/null || echo "unknown")
          if [ "$TT" != "active" ]; then
            echo "   ⏸ $WF đang '$TT' — người vận hành đã tắt có chủ đích. KHÔNG bấm thay."
            continue
          fi
          # ── CỬA SỔ 20h -> 5h  (3/9/2026) ────────────────────────────────────────────────
          # Cơ chế bấm-thay CÓ chạy, nhưng nó từng hỏi sai câu: *"20 giờ qua có lượt dựng nào
          # chưa?"* Con số 20h là di sản của thời sản xuất một lượt mỗi ngày. Nay 5h, khớp
          # đúng cổng chống trùng (§13.6 — hằng số sống lâu hơn ngữ cảnh sinh ra nó).
          MOC=$(python3 -c "import datetime;print((datetime.datetime.now(datetime.timezone.utc)-datetime.timedelta(hours=5)).strftime('%Y-%m-%dT%H:%M:%SZ'))")
          # ĐANG CHẠY thì đừng bấm: nhóm `concurrency` sẽ huỷ lượt mới hoặc bắt nó xếp hàng.
          DANG=$(gh api "repos/${{ github.repository }}/actions/workflows/$WF/runs?status=in_progress&per_page=1" --jq '.total_count' 2>/dev/null || echo 0)
          if [ "${DANG:-0}" != "0" ]; then
            echo "   ▶ $WF đang có lượt chạy — không bấm thêm"
            continue
          fi
          IDS=$(gh api "repos/${{ github.repository }}/actions/workflows/$WF/runs?per_page=20" \
                  --jq ".workflow_runs[] | select(.created_at > \"$MOC\") | .id" || echo "")
          THAT=0
          for id in $IDS; do
            n=$(gh api "repos/${{ github.repository }}/actions/runs/$id/jobs?per_page=100" \
                  --jq '[.jobs[] | select(.name|startswith("dung")) | select(.conclusion != null and .conclusion != "skipped")] | length' || echo 0)
            THAT=$((THAT + n))
          done
          echo "   $WF · 5h qua: $THAT job dựng THẬT (không tính job bị cổng bỏ qua)"
          if [ "$THAT" -gt 0 ]; then
            echo "   ✅ $WF đã chạy trong cửa sổ — không cần bấm thay"
            continue
          fi
          echo "   ⏰ $WF: 5h không có lượt dựng nào — bấm thay cho cron"
          TRUOC=$(gh api "repos/${{ github.repository }}/actions/workflows/$WF/runs?per_page=1" --jq '.total_count' || echo 0)
          gh workflow run "$WF" --repo "${{ github.repository }}" || echo "   ❌ lệnh bấm hỏng"
          sleep 25
          SAU=$(gh api "repos/${{ github.repository }}/actions/workflows/$WF/runs?per_page=1" --jq '.total_count' || echo 0)
          # BẤM XONG PHẢI ĐẾM LẠI. `gh workflow run` trả 204 kể cả khi lượt không hề sinh ra
          # (token sai loại là đúng cảnh ấy). Không đếm lại thì ta có một cái canh gác luôn báo
          # đã canh, và hỏng y hệt kiểu cron im lặng mà nó sinh ra để chữa.
          if [ "$SAU" -gt "$TRUOC" ]; then
            echo "   ✅ $WF: đã sinh lượt render mới ($TRUOC -> $SAU)"
          else
            echo "   ❌ $WF: BẤM XONG KHÔNG CÓ LƯỢT NÀO SINH RA ($TRUOC -> $SAU)."
            echo "      Nhiều khả năng AUTOPUBLISHER_TOKEN thiếu quyền workflow trên repo này."
            LOI=1
          fi
          done
          [ "$LOI" -eq 0 ] || exit 1

      - name: Health check + tự chữa
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          # 26/8 — sổ đo lượt Firestore của publish/thumbnail/health-guardian xả về D1 qua
          # HOT_KEY. Thiếu biến này thì sổ vẫn đếm nhưng không ai đọc được — mà 100 lượt
          # chạy/ngày của nhóm này chính là ~52% trần Firestore chưa từng được nhìn.
          HOT_KEY: ${{ secrets.HOT_KEY }}
          HOT_MODE: on
          GOOGLE_APPLICATION_CREDENTIALS_B: /tmp/sa_b.json
          FIREBASE_PROJECT_ID_B: ${{ secrets.FIREBASE_PROJECT_ID_B }}
          OWNER_UID: ${{ secrets.OWNER_UID }}
          STALE_HOURS_OVERRIDE: ${{ github.event.inputs.stale_hours }}
        run: python render-pipeline/health_guardian.py

      # ── BẢNG GẮN KÊNH  (7/9/2026) ────────────────────────────────────────────────────
      # Chạy ở ĐÂY chứ không ở máy anh: bảng cần đọc `connections` trên Firestore, mà máy
      # anh không có khoá dịch vụ nên mọi ô đều ra "chưa kiểm được" — một bảng không kết
      # luận được gì thì không phải một bảng.
      # `|| true` được phép ở bước này vì nó chỉ BÁO CÁO, không giao hàng: hỏng thì mất một
      # dòng thông tin, không mất tệp nào (§13.3 — `|| true` chỉ cấm ở mắt xích cuối).
      - name: Kênh nào đã gắn, kênh nào chưa
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          GOOGLE_APPLICATION_CREDENTIALS_B: /tmp/sa_b.json
          FIREBASE_PROJECT_ID_B: ${{ secrets.FIREBASE_PROJECT_ID_B }}
          OWNER_UID: ${{ secrets.OWNER_UID }}
          GH_TOKEN: ${{ secrets.AUTOPUBLISHER_TOKEN }}
        run: |
          pip install --quiet pyyaml
          python render-pipeline/kiem_gan_kenh.py || true
