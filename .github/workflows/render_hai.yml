name: MM0 Comic (10 kênh hài)

# ══════════════════════════════════════════════════════════════════════════════════════════
# XƯỞNG RIÊNG CHO BỘ HÀI THẾ HỆ 4 — CỐ Ý KHÔNG CÓ CRON
#
# 30/8/2026 — Bộ này tách hẳn khỏi `render_cron.yml` (50 kênh dữ liệu) vì ba lý do:
#
#   1. **KHÔNG ĐƯỢC ĐỤNG 50 KÊNH ĐANG CHẠY TỐT.** Anh dặn rõ. Thêm một nhánh vào workflow chung
#      là thêm một chỗ có thể làm hỏng cả mười tám luồng đang khoẻ.
#   2. **KHÁC HẲN VỀ TÀI NGUYÊN.** Bộ hài không gọi Firestore để chọn đề tài, không gọi nguồn dữ
#      liệu mở, và nền đã cache sẵn nên hầu như không cần khoá vẽ ảnh. Nó chỉ cần ffmpeg +
#      edge-tts + Remotion. Nhồi nó vào workflow chung là bắt nó chờ những bước nó không dùng.
#   3. **CHƯA ĐƯỢC ANH DUYỆT HÌNH ẢNH.** Bật cron trước khi anh xem là tự ý cho phát hàng loạt.
#
# 31/8 — ANH ĐÃ DUYỆT HÌNH, BẬT SẢN XUẤT. Thêm `schedule`. Số tập lấy theo NGÀY trong năm nên
# mỗi ngày một mẩu khác nhau, và kho 28–39 mẩu/kênh đủ cho một tháng không lặp.
# ══════════════════════════════════════════════════════════════════════════════════════════

on:
  schedule:
    # 03:10 UTC = 10:10 giờ VN. Lệch khỏi đầu giờ tròn: hàng đợi Actions đông nhất ở phút 00.
    # 1/9 — BỐN MỐC, KHÔNG PHẢI MỘT. Lịch của repo này bị GitHub hoãn hàng giờ và có tick bị
    # bỏ hẳn (xem ghi chú trong `render_phan_tich_18.yml`). Job `chot` bảo đảm chỉ dựng một lần
    # mỗi ngày dù cả bốn mốc cùng nổ.
    - cron: "10 3 * * *"
    - cron: "10 4 * * *"
    - cron: "10 5 * * *"
    - cron: "10 6 * * *"
    - cron: "10 7 * * *"
    - cron: "10 8 * * *"
  workflow_dispatch:
    inputs:
      vong:
        description: "Vòng kịch bản (0-3): mỗi vòng một chuyện + một bối cảnh khác"
        default: "0"
      kenh:
        description: "Chỉ dựng vài kênh, cách nhau bằng dấu phẩy (bỏ trống = cả 10)"
        default: ""

# ══════════════════════════════════════════════════════════════════════════════════════════
# LUẬT 18+2 — KHÔNG BAO GIỜ CHIẾM QUÁ 18 JOB CÙNG LÚC
#
# Trần đồng thời của tài khoản Free là 20 job cho CẢ tài khoản, không phải cho mỗi workflow.
# Hai luồng cuối phải để trống cho các workflow ĐIỀU PHỐI vẫn chạy được: `publish.yml` (mỗi
# 30'), `publish_social.yml`, `health_guardian.yml` (mỗi giờ), `thumb_requests.yml`. Chúng bị
# xếp hàng là dashboard đứng hình và video xong không được đăng.
#
# 1/9 — anh nhắc: *"bữa kêu là chỉ chạy 18 luồng còn 2 luồng để điều phối mà sao ko ghi rule
# vào"*. Đúng: luật này chỉ nằm trong đầu, nên khi em thêm workflow comic 10 luồng và bấm chạy
# cùng lúc với 18 luồng phân tích thì thành 28 job — 8 job xếp hàng, và hai luồng điều phối
# cũng xếp hàng theo. Luật không có cơ chế thì nó không phải luật.
#
# CƠ CHẾ: hai xưởng render dùng CHUNG một `concurrency group`. Một xưởng chạy thì xưởng kia
# đợi, nên tổng job render không bao giờ vượt `max-parallel` của xưởng lớn nhất = 18.
# ══════════════════════════════════════════════════════════════════════════════════════════
concurrency: { group: mm0-render, cancel-in-progress: false }

jobs:
  chot:
    runs-on: ubuntu-latest
    outputs:
      chay: ${{ steps.q.outputs.chay }}
    steps:
      - id: q
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "chay=yes" >> $GITHUB_OUTPUT; echo "bấm tay -> chạy"; exit 0
          fi
          CUT=$(date -u -d '20 hours ago' +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u -v-20H +%Y-%m-%dT%H:%M:%SZ)
          N=$(gh api "repos/${{ github.repository }}/actions/workflows/render_hai.yml/runs?per_page=20" \
              --jq "[.workflow_runs[] | select(.id != ${{ github.run_id }})
                     | select(.created_at > \"$CUT\")
                     | select(.conclusion == \"success\" or .status == \"in_progress\")] | length")
          echo "lượt gần đây (20h): $N"
          if [ "${N:-0}" -gt 0 ]; then
            echo "chay=no" >> $GITHUB_OUTPUT; echo "hôm nay đã dựng rồi -> bỏ lượt"
          else
            echo "chay=yes" >> $GITHUB_OUTPUT
          fi

  dung:
    needs: chot
    if: needs.chot.outputs.chay == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # ══ 1/9 — MỖI KÊNH MỘT LUỒNG ═════════════════════════════════════════════════════════
    # Bản trước dựng 10 bản ngắn + 10 BẢN DÀI trong MỘT job với trần 120 phút. Đo ra:
    #   bản ngắn 14 giây  -> ~35 giây dựng
    #   bản dài 7 phút    -> ~19 phút trên máy anh, tức ~38 phút trên runner 2 nhân
    #   tổng: 10×1 + 10×38 = ~390 phút,  gấp hơn ba lần trần.
    # Job sẽ bị huỷ ở phút 120 — và huỷ thì bước `upload-artifact` KHÔNG chạy, nên mất luôn cả
    # 10 bản ngắn đã dựng xong. Cùng họ lỗi "gói về tay không" ở mục 24.1: hỏng mà không có
    # tệp nào để lại thì trông y hệt như chưa từng chạy.
    # Chia mỗi kênh một luồng: ~40 phút, thừa chỗ trong trần 90.
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        kenh: ["RENTPANIC", "GYMLIES", "AIRPORTHELL", "CARGUY", "OFFICESMALLTALK",
               "DIETWARS", "TECHSUPPORT", "PARENTMODE", "NEIGHBORWATCH", "DATINGAPP"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: Cache node_modules
        id: cache-node
        uses: actions/cache@v4
        with:
          path: engine-remotion/node_modules
          key: node-modules-${{ hashFiles('engine-remotion/package-lock.json') }}
      - name: Cache Chrome Remotion
        uses: actions/cache@v4
        with:
          path: |
            ~/.remotion
            ~/.cache/remotion
          key: remotion-chrome-${{ hashFiles('engine-remotion/package-lock.json') }}

      - name: Thư viện hệ thống
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64 \
            libpango-1.0-0 libcairo2 libatspi2.0-0 || sudo apt-get install -y ffmpeg libasound2

      # `pillow` ở LỆNH RIÊNG — gộp chung làm pip nổ "resolution-too-deep" (sự cố 20/8).
      # Bộ hài cần PIL cho hai việc: kéo sáng nền và làm thumbnail.
      - name: Python deps
        run: |
          pip install --quiet -c render-pipeline/constraints.txt edge-tts pyyaml requests
          pip install --quiet pillow

      - name: npm ci (chỉ khi cache MISS)
        if: steps.cache-node.outputs.cache-hit != 'true'
        working-directory: engine-remotion
        run: npm ci
      - name: Ensure Chrome
        working-directory: engine-remotion
        run: npx remotion browser ensure

      # CHỐT AN TOÀN — cùng cổng mà 50 kênh đang dùng. Một tệp .tsx hỏng là CẢ nhà máy đứng, và
      # bộ hài dùng chung gói Remotion với chúng.
      - name: Selftest (cảnh báo, không chặn)
        run: python render-pipeline/selftest.py || echo "  ⚠️ selftest có cảnh báo"

      # ══ CỔNG CHẠY TRƯỚC, KHÔNG PHẢI SAU ═══════════════════════════════════════════════
      # 31/8 — Anh: *"qua cũng bị lỗi thế sao nay vẫn bị, cần fix đúng rule ko lặp lại"* và
      # *"fix cả auto trên pipeline sau này tự động trên github"*.
      #
      # Hai cổng này chặn đúng hai lỗi đã tái diễn: đồ vật lơ lửng vì có nhiều mức sàn, và
      # "tưởng hết quota" vì đọc một lỗi 429 thành cả pool cạn. Chúng chạy TRƯỚC khi dựng —
      # chạy sau thì tốn cả lượt render mới biết hỏng, mà trên Actions một lượt là gần một
      # tiếng máy.
      - name: Cổng — mặt sàn, xoay khoá, prompt nền, âm lượng + bóng
        run: |
          cd render-pipeline
          python kiem_san.py
          python kiem_xoay_key.py
          python kiem_nen.py
          python kiem_am.py
          python kiem_workflow.py
          python kiem_bien.py
          python kiem_kieu.py
          python kiem_song_song.py

      # BƯỚC CHUẨN BỊ TÁCH KHỎI BƯỚC DỰNG — đây là chỗ được phép gọi API và được phép hỏng.
      # Bước dựng phía dưới chỉ đọc đĩa, không gọi khoá nào, nên một sự cố mạng không thể làm
      # mất cả lượt render. `|| true`: thiếu nền thì engine còn ba tầng đỡ phía sau (mượn nền
      # cùng kênh, rồi nền vector vẽ bằng code) — không tầng nào cần API.
      - name: Chuẩn bị nền (tầng 2 — được phép gọi API, được phép hỏng)
        env:
          CF_KEYS: ${{ secrets.CF_KEYS }}
          GEMINI_KEYS: ${{ secrets.GEMINI_KEYS }}
        run: |
          cd render-pipeline
          VONG="${{ inputs.vong }}"
          [ -z "$VONG" ] && VONG=$(date -u +%j)
          # NỀN RIÊNG CHO TẬP HÔM NAY — anh: *"tạo cho đa dạng, ko dùng lại, mà tạo cho đúng
          # bối cảnh channel, videos"*. Mỗi tập một ảnh, đổi ánh sáng + góc máy, nhưng vẫn ép
          # sàn chiếm trọn phần ba dưới · đồ đạc dồn hai mép · giữa để trống.
          python chuan_bi_nen.py --vong "$VONG" --kenh "${{ matrix.kenh }}" || true
          # Lớp đỡ: nếu nơi chốn nào chưa có ảnh CHUẨN thì sinh bù, để `noi_va_nen` luôn có
          # thứ để rơi xuống khi ảnh riêng của tập sinh hỏng.
          python chuan_bi_nen.py --kenh "${{ matrix.kenh }}" || true
          # Đo lại hướng sáng: nếu bước trên vừa sinh nền mới thì chúng chưa có số đo, mà thiếu
          # số đo là nhân vật ở nền ấy mất luôn phần khớp màu — lặng lẽ, không lỗi nào báo.
          python huong_sang.py || true

      # Nền 3D đã cache trong repo (`engine-remotion/public/comic_nen`) nên bước dựng gần như
      # không gọi khoá vẽ ảnh nào; chỉ những nơi chốn chưa có nền mới cần sinh.
      - name: Dựng ngắn 9:16 — ${{ matrix.kenh }}
        env:
          CF_KEYS: ${{ secrets.CF_KEYS }}
          GEMINI_KEYS: ${{ secrets.GEMINI_KEYS }}
        run: |
          cd render-pipeline
          VONG="${{ inputs.vong }}"
          [ -z "$VONG" ] && VONG=$(date -u +%j)
          echo "  vòng = $VONG · kênh = ${{ matrix.kenh }}"
          python kich_comic.py --kenh "${{ matrix.kenh }}" --vong "$VONG"
          python sieu_du_lieu.py --kenh "${{ matrix.kenh }}" --vong "$VONG"

      # BẢN DÀI 16:9 — chỗ bật quảng cáo giữa video, tức nguồn tiền chính. Trước 31/8 nó hoàn
      # toàn không có trong workflow nào. `|| true` vì bản dài cần ≥25 mẩu trong kho — kênh nào
      # chưa đủ thì bỏ lượt dài, KHÔNG được kéo theo bản ngắn đã dựng xong.
      - name: Dựng dài 16:9 — ${{ matrix.kenh }}
        env:
          CF_KEYS: ${{ secrets.CF_KEYS }}
          GEMINI_KEYS: ${{ secrets.GEMINI_KEYS }}
        run: |
          cd render-pipeline
          VONG="${{ inputs.vong }}"
          [ -z "$VONG" ] && VONG=$(date -u +%j)
          python kich_comic_long.py --kenh "${{ matrix.kenh }}" --vong "$VONG" || true
          python sieu_du_lieu.py --kenh "${{ matrix.kenh }}" --vong "$VONG" --long || true

      - name: Chấm chất lượng (ngưỡng 90)
        run: cd render-pipeline && python cham_v4.py || true

      # 31/8 — GÓI ĐÚNG THỨ VỪA DỰNG. Đường dẫn cũ là `v4_*`, mà pipeline comic xuất ra `v5_*`:
      # một lượt chạy sẽ dựng đủ 10 video rồi gói về TAY KHÔNG, và không lỗi nào được ném ra.
      # Cùng họ lỗi với `cham_v4.py` chấm nhầm tiền tố — cả hai đều là mảnh sót lại của engine
      # cũ, sống sót vì "không có tệp khớp" không phải là lỗi trong YAML.
      # Kèm `.tai.json`: thiếu nó thì có video mà không có tiêu đề/mô tả/thẻ để đăng.
      - name: Gói kết quả
        uses: actions/upload-artifact@v4
        with:
          name: comic-${{ matrix.kenh }}-${{ inputs.vong || github.run_number }}
          path: |
            render-pipeline/out/v5_*.mp4
            render-pipeline/out/v5_*.jpg
            render-pipeline/out/v5_*.tai.json
            render-pipeline/out/v5L_*.mp4
            render-pipeline/out/v5L_*.jpg
            render-pipeline/out/v5L_*.tai.json
          retention-days: 14
          if-no-files-found: warn
