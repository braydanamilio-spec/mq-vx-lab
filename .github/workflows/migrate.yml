name: MM0 Migrate to Shards (A -> B + C)

# CHẠY 1 LẦN khi Firestore A đã reset quota: dời config/keys -> B, publish -> C.
# Đọc A tối thiểu (mỗi collection stream 1 lượt). Mặc định dry-run (chỉ đếm, KHÔNG ghi).
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = chỉ đếm (không ghi); 0 = migrate thật"
        default: "1"

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Deps
        run: pip install --quiet -c render-pipeline/constraints.txt google-cloud-firestore google-auth
      - name: Service account files (A + B + C)
        run: |
          echo '${{ secrets.GCP_SA_KEY }}'   > /tmp/sa.json
          echo '${{ secrets.GCP_SA_KEY_B }}' > /tmp/sa_b.json
          echo '${{ secrets.GCP_SA_KEY_C }}' > /tmp/sa_c.json
      - name: Migrate
        env:
          GOOGLE_APPLICATION_CREDENTIALS:   /tmp/sa.json
          FIREBASE_PROJECT_ID:              ${{ secrets.FIREBASE_PROJECT_ID }}
          GOOGLE_APPLICATION_CREDENTIALS_B: /tmp/sa_b.json
          FIREBASE_PROJECT_ID_B:            ${{ secrets.FIREBASE_PROJECT_ID_B }}
          GOOGLE_APPLICATION_CREDENTIALS_C: /tmp/sa_c.json
          FIREBASE_PROJECT_ID_C:            ${{ secrets.FIREBASE_PROJECT_ID_C }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "0" ]; then
            python render-pipeline/migrate_to_shards.py
          else
            python render-pipeline/migrate_to_shards.py --dry-run
          fi
