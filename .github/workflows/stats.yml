name: MM0 Stats Refresh (public runner)

# Kéo view/like/comment + subscriber về Firestore cho dashboard. Read-only, nhẹ.
# Credential YouTube từ Firestore connections. Chạy repo public = free vô hạn.

on:
  schedule:
    - cron: "30 */6 * * *"   # 00:30, 06:30, 12:30, 18:30 UTC
  workflow_dispatch:

concurrency: { group: mm0-stats, cancel-in-progress: true }

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout AutoPublisher (private)
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.AUTOPUBLISHER_REPO }}
          token: ${{ secrets.AUTOPUBLISHER_TOKEN }}
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: "pip" }
      - run: pip install -r requirements.txt
      - name: Ghi service account key
        run: echo '${{ secrets.GCP_SA_KEY }}' > /tmp/sa.json
      - name: Refresh stats
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: python src/stats.py
