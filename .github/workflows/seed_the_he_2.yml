name: MM0 — Đăng ký 50 kênh thế hệ 2

# CHẠY TAY. Mặc định chỉ liệt kê (không ghi) và tạo ở trạng thái TẮT.
# Vì sao mặc định TẮT: bật 50 kênh mới trong khi 55 kênh cũ còn chạy = 105 kênh chen nhau trên
# 18 lane, không kênh nào ra hồn. Trình tự đúng: tắt kênh cũ trước, rồi bật kênh mới.
on:
  workflow_dispatch:
    inputs:
      ghi_that:
        description: "1 = ghi thật vào render_channels; 0 = chỉ liệt kê"
        default: "0"
      bat_ngay:
        description: "1 = bật chạy luôn; 0 = tạo nhưng để TẮT (khuyên dùng)"
        default: "0"

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Deps
          # 26/8 — DANH SÁCH NÀY PHẢI ĐỦ NHƯ `render_cron`, vì bước sau chạy `selftest.py`
          # và selftest có chốt đọc file YAML của workflow. Thiếu `pyyaml` là selftest
          # KHÔNG chạy nổi rồi thoát mã 1 ⇒ chặn luôn cả việc chính, dù việc chính không
          # cần thư viện đó. Lần seed 07:01Z hôm nay chết đúng kiểu này: `❌ step trỏ
          # Project C phải bật SHARD_PUBLISH: No module named 'yaml'`.
          # 07:10Z — lần vá đầu nới danh sách quá tay (thêm cả generativeai/edge-tts/
          # oauthlib) và pip chết vì `resolution-too-deep`. Chỉ thêm ĐÚNG thứ thiếu.
        run: pip install --quiet -c render-pipeline/constraints.txt google-cloud-firestore google-auth pyyaml
      - name: Khoá dịch vụ
        run: echo '${{ secrets.GCP_SA_KEY_B }}' > /tmp/sa_b.json
      - name: Tự kiểm trước (chặn bản hỏng)
        run: python render-pipeline/selftest.py
      - name: Đăng ký
        env:
          GOOGLE_APPLICATION_CREDENTIALS_B: /tmp/sa_b.json
          FIREBASE_PROJECT_ID_B: ${{ secrets.FIREBASE_PROJECT_ID_B }}
          # Gương B2: đúng lúc B cạn hạn mức là lúc cần thao tác quản trị nhất,
          # nên công cụ quản trị phải lật được sang gương như dây chuyền chính.
          FIREBASE_PROJECT_ID_B2: mm0-shard-b2
          OWNER_UID: ${{ secrets.OWNER_UID }}
          # 26/8 — THIẾU CỜ NÀY LÀ CÔNG CỤ QUẢN TRỊ GHI SAI PROJECT.
          # `firestore_bridge._db_meta()` chỉ trỏ vào project B khi `SHARD_META=1`; không có cờ thì
          # nó về project A. `render_cron` có truyền cờ (vars.SHARD_META = 1), workflow này thì
          # không ⇒ seed ghi 50 kênh vào A trong khi dây chuyền đọc `render_channels` ở B ⇒ 50 kênh
          # VÔ HÌNH, mà vẫn tốn trọn cửa sổ hạn mức. Cùng lỗi ở `don_the_he_1`: nó đọc danh sách
          # kênh cũ ở A (rỗng) rồi báo "dọn 0 tệp" như thể thành công.
          SHARD_META: ${{ vars.SHARD_META }}
          SHARD_KEYS: ${{ vars.SHARD_KEYS }}
          SHARD_PUBLISH: ${{ vars.SHARD_PUBLISH }}
          HOT_KEY: ${{ secrets.HOT_KEY }}
          HOT_MODE: on
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.ghi_that }}" = "1" ]; then ARGS="$ARGS --that"; fi
          if [ "${{ github.event.inputs.bat_ngay }}" = "1" ]; then ARGS="$ARGS --bat"; fi
          python render-pipeline/seed_the_he_2.py $ARGS
