name: MM0 Fix Queue Thumbnails (one-time, manual)

# MỘT LẦN: nâng cấp thumbnail cho video 10 kênh gốc ĐÃ RENDER nhưng còn nằm trong Drive _QUEUE
# (chưa đăng, chưa lên lịch) — dùng DocThumb (title thật + màu kênh thật + ảnh thật fetch lại
# theo topic). KHÔNG đụng file video. Xem chi tiết + giới hạn thật: render-pipeline/fix_queue_thumbnails.py
#
# CHỈ workflow_dispatch — KHÔNG cron. Chạy bằng nút "Run workflow" trên tab Actions, hoặc yêu cầu
# Claude chạy TRỰC TIẾP bằng lời trong chat (theo PIPELINE_RULES.md — không tự trigger để "test").
# Luôn chạy dry_run=true trước để xem trước danh sách, rồi mới chạy dry_run=false cho thật.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Chạy thử — chỉ liệt kê, không đổi gì"
        type: boolean
        default: true
      limit:
        description: "Giới hạn số video xử lý (0 = không giới hạn)"
        type: string
        default: "0"

concurrency: { group: mm0-fix-queue-thumbnails, cancel-in-progress: false }

jobs:
  # ── TIỀN KIỂM (~2 phút) ─────────────────────────────────────────────────────────────────────
  # Vì sao có bước này: 20/8 một lỗi pip vặt làm CẢ 10 LUỒNG chết ở bước cài, mà phải chờ hết lượt
  # mới biết -> mất 2 tiếng cho 0 video. Giờ kiểm nhanh những thứ HAY HỎNG (cài thư viện, import
  # được script, đọc được Drive) trên MỘT máy; không đạt thì 10 luồng nặng KHÔNG khởi động.
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ secrets.AUTOPUBLISHER_REPO }}
          token: ${{ secrets.AUTOPUBLISHER_TOKEN }}
          path: _autopublisher
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Cài thư viện (đúng bộ mà job thật dùng)
        run: |
          pip install --quiet -c render-pipeline/constraints.txt google-generativeai edge-tts google-cloud-firestore \
            google-api-python-client google-auth pyyaml
          pip install --quiet pillow google-genai
      - name: ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Kiểm import + đọc Drive + ffmpeg
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          HOT_KEY: ${{ secrets.HOT_KEY }}
          AUTOPUBLISHER_SRC: ${{ github.workspace }}/_autopublisher/src
          OWNER_UID: ${{ secrets.OWNER_UID }}
        run: |
          echo '${{ secrets.GCP_SA_KEY }}' > /tmp/sa.json
          python - <<'PY'
          import os, sys, subprocess
          sys.path.insert(0, "render-pipeline")
          import fix_queue_thumbnails as F          # gãy ở đây = thiếu thư viện / lỗi cú pháp
          print("✔ import script OK")
          from PIL import Image; print("✔ pillow OK")
          assert subprocess.run(["ffmpeg","-version"],capture_output=True).returncode == 0
          assert subprocess.run(["ffprobe","-version"],capture_output=True).returncode == 0
          print("✔ ffmpeg/ffprobe OK")
          accs = F.ST.pool_accounts()
          assert accs, "KHÔNG đọc được tài khoản Drive nào -> sai secret hoặc hỏng kết nối"
          print(f"✔ đọc được {len(accs)} kho Drive")
          k = F._vision_key()
          print("✔ key Gemini:", "CÓ" if k else "KHÔNG (sẽ bỏ qua bước chấm ảnh)")
          PY

  fix:
    needs: preflight        # tiền kiểm trượt -> KHÔNG đốt 10 luồng
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      # MỖI KÊNH 1 LUỒNG: phải TẢI VIDEO về để rút khung hình thật làm nền, nên chạy tuần tự cả 770
      # video sẽ mất nhiều giờ. Chia 10 luồng -> mỗi luồng ~77 video. fail-fast=false: 1 kênh lỗi
      # không giết các kênh còn lại.
      fail-fast: false
      max-parallel: 5     # để dành luồng cho render_cron/publish đang chạy theo lịch
      matrix:
        channel: [DATARACE, STATEWARS, MONEYMOVES, POWERPLAY, GRIDIRON,
                  SCREENKINGS, PAYCHECK, BODYUSA, RIDEUSA, EATSUSA]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ secrets.AUTOPUBLISHER_REPO }}
          token: ${{ secrets.AUTOPUBLISHER_TOKEN }}
          path: _autopublisher
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Cache node_modules (khỏi npm ci lại)
        id: cache-node
        uses: actions/cache@v4
        with:
          path: engine-remotion/node_modules
          key: node-modules-${{ hashFiles('engine-remotion/package-lock.json') }}
      - name: Cache Chrome Remotion (khỏi tải lại)
        uses: actions/cache@v4
        with:
          path: |
            ~/.remotion
            ~/.cache/remotion
          key: remotion-chrome-${{ hashFiles('engine-remotion/package-lock.json') }}
      - name: Thư viện hệ thống
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64 \
            libpango-1.0-0 libcairo2 libatspi2.0-0 || sudo apt-get install -y libasound2
      - name: Python deps
        # CHIA 2 LỆNH, KHÔNG gộp: gộp tất cả vào 1 lệnh làm bộ giải phụ thuộc của pip nổ
        # "resolution-too-deep" -> cả 10 luồng chết ngay ở bước cài (sự cố 20/8, 0 video được xử lý).
        # Dòng 1 giữ ĐÚNG bộ đã chạy ổn định trong render_cron.yml; pillow cài riêng.
        run: |
          pip install --quiet -c render-pipeline/constraints.txt google-generativeai edge-tts google-cloud-firestore \
            google-api-python-client google-auth pyyaml
          pip install --quiet pillow google-genai
      - name: npm ci (chỉ khi cache MISS)
        if: steps.cache-node.outputs.cache-hit != 'true'
        working-directory: engine-remotion
        run: npm ci
      - name: Ensure Chrome (cache -> gần như tức thì)
        working-directory: engine-remotion
        run: npx remotion browser ensure
      - name: Service account file (A đọc pool Drive qua Firestore connections)
        run: echo '${{ secrets.GCP_SA_KEY }}' > /tmp/sa.json
      - name: Chạy fix_queue_thumbnails cho kênh ${{ matrix.channel }}
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          HOT_KEY: ${{ secrets.HOT_KEY }}
          AUTOPUBLISHER_SRC: ${{ github.workspace }}/_autopublisher/src
          OWNER_UID: ${{ secrets.OWNER_UID }}   # để đọc key Gemini (Vision kiểm ảnh có KHỚP chủ đề không)
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" != "false" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ github.event.inputs.limit }}" != "0" ]; then ARGS="$ARGS --limit ${{ github.event.inputs.limit }}"; fi
          python render-pipeline/fix_queue_thumbnails.py --channel "${{ matrix.channel }}" $ARGS
