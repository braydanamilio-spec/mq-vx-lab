name: MM0 Publish FB+Instagram (public runner)

# ĐĂNG FACEBOOK + INSTAGRAM trên REPO PUBLIC = phút KHÔNG giới hạn.
# Token FB/IG ở Firestore -> chỉ cần SA + project. Code checkout từ repo private.

on:
  schedule:
    - cron: "15,45 * * * *"   # lệch 15' so với YouTube
  workflow_dispatch:
    inputs:
      dry_run: { description: "Chạy thử (không đăng)", type: boolean, default: false }

concurrency: { group: mm0-social, cancel-in-progress: false }

jobs:
  social:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout AutoPublisher (private)
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.AUTOPUBLISHER_REPO }}
          token: ${{ secrets.AUTOPUBLISHER_TOKEN }}
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: "pip" }
      - run: pip install -r requirements.txt
      - name: Ghi service account key
        run: echo '${{ secrets.GCP_SA_KEY }}' > /tmp/sa.json
      - name: Đăng FB + Instagram
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python src/publish_social.py --dry-run
          else
            python src/publish_social.py
          fi
