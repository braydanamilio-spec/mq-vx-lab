name: MM0 Publish FB+Instagram (public runner)

# ĐĂNG FACEBOOK + INSTAGRAM trên REPO PUBLIC = phút KHÔNG giới hạn.
# Token FB/IG ở Firestore -> chỉ cần SA + project. Code checkout từ repo private.

on:
  schedule:
    # 96 lượt/ngày — nhiều gấp đôi luồng YouTube, cho cùng một loại việc và cùng một kiểu
    # đọc (`list_social_queue` quét tới 2.000 mục mỗi lượt). Chính docstring của hàm ấy đã
    # ghi *"644 mục × 96 lượt cron = 123% trần"*. Hạ về 12 lượt/ngày, vẫn lệch giờ so với
    # luồng YouTube để hai bên không cùng đọc một lúc.  (4/9/2026)
    - cron: "35 1-23/2 * * *"   # mỗi 2 giờ, lệch 30' so với YouTube
  workflow_dispatch:
    inputs:
      dry_run: { description: "Chạy thử (không đăng)", type: boolean, default: false }

concurrency: { group: mm0-social, cancel-in-progress: false }

jobs:
  social:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout AutoPublisher (private)
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.AUTOPUBLISHER_REPO }}
          token: ${{ secrets.AUTOPUBLISHER_TOKEN }}
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: "pip" }
      - run: pip install -r requirements.txt
      - name: Ghi service account key (A + B + C)
        run: |
          echo '${{ secrets.GCP_SA_KEY }}' > /tmp/sa.json
          echo '${{ secrets.GCP_SA_KEY_B }}' > /tmp/sa_b.json   # render_jobs -> Project B
          echo '${{ secrets.GCP_SA_KEY_C }}' > /tmp/sa_c.json   # publish owned -> Project C
      - name: Đăng FB + Instagram
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          # 26/8 — sổ đo lượt Firestore của publish/thumbnail/health-guardian xả về D1 qua
          # HOT_KEY. Thiếu biến này thì sổ vẫn đếm nhưng không ai đọc được — mà 100 lượt
          # chạy/ngày của nhóm này chính là ~52% trần Firestore chưa từng được nhìn.
          HOT_KEY: ${{ secrets.HOT_KEY }}
          HOT_MODE: on
          GOOGLE_APPLICATION_CREDENTIALS_B: /tmp/sa_b.json
          FIREBASE_PROJECT_ID_B: ${{ secrets.FIREBASE_PROJECT_ID_B }}
          GOOGLE_APPLICATION_CREDENTIALS_C: /tmp/sa_c.json
          FIREBASE_PROJECT_ID_C: ${{ secrets.FIREBASE_PROJECT_ID_C }}
          SHARD_PUBLISH: ${{ vars.SHARD_PUBLISH }}   # publish owned (videos/counters/quota/queues) -> Project C
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python src/publish_social.py --dry-run
          else
            python src/publish_social.py
          fi
