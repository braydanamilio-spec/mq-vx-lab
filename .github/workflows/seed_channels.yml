name: MM0 Seed Channels Wave 8 (một lần, chạy tay)

# Ghi 10 kênh Wave 8 vào render_channels (Project B). Data: render-pipeline/wave8_channels.json.
# Chạy dry_run=true trước để xem, rồi chạy thật. set merge=True nên chạy lại không hỏng gì.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Chạy thử — chỉ liệt kê, không ghi"
        type: boolean
        default: true

concurrency: { group: mm0-seed-channels, cancel-in-progress: false }

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Python deps
        run: pip install --quiet -c render-pipeline/constraints.txt google-cloud-firestore google-auth
      - name: Service accounts
        run: |
          echo '${{ secrets.GCP_SA_KEY }}' > /tmp/sa.json
          echo '${{ secrets.GCP_SA_KEY_B }}' > /tmp/sa_b.json
      - name: Seed Wave 8
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          GOOGLE_APPLICATION_CREDENTIALS_B: /tmp/sa_b.json
          FIREBASE_PROJECT_ID_B: ${{ secrets.FIREBASE_PROJECT_ID_B }}
          SHARD_META: ${{ vars.SHARD_META }}
          OWNER_UID: ${{ secrets.OWNER_UID }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" != "false" ]; then ARGS="--dry-run"; fi
          python render-pipeline/seed_channels_wave8.py $ARGS
