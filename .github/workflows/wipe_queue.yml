name: MM0 Wipe Queue (dọn sạch _QUEUE mọi kho)

# DỌN SẠCH video/thumbnail/sidecar trong _QUEUE của MỌI kho, để làm lại từ đầu.
# Đi đường storage.py -> danh sách kho lấy từ BẢN GƯƠNG project B, KHÔNG đụng quota project A
# (bản dọn chạy từ trình duyệt đi qua Worker -> đọc A -> chết khi A cạn quota).
# Chỉ chạy khi bấm tay: đây là việc phá hủy dữ liệu, không được để cron tự làm.

on:
  workflow_dispatch:
    inputs:
      do_wipe: { description: "CÓ dọn kho Drive không (NGUY HIỂM: xoá file). Tắt nếu chỉ chạy việc bảo trì khác", type: boolean, default: false }
      dry_run: { description: "Chạy thử (chỉ đếm, không đụng file)", type: boolean, default: true }
      scope: { description: "store = mọi file dưới MM0-STORE · queue = chỉ _QUEUE", type: choice, options: [store, queue], default: store }
      rebuild_stats: { description: "Dựng lại SỔ ĐẾM từ số job thật (sửa việc phiên khẩn làm dư video)", type: boolean, default: false }
      fix_dup: { description: "Dọn bản ghi kho TRÙNG TÊN (token chết) — vd ADISONDURHAM", type: boolean, default: false }
      reset_topics: { description: "Xoá LUÔN sổ chủ đề (kênh làm lại đề tài từ đầu) — cần bật cùng reset_ledger", type: boolean, default: false }
      reset_ledger: { description: "Reset luôn SỔ (render_jobs + số đếm) — dashboard hết hiện video cũ", type: boolean, default: false }
      fix_overlap: { description: "Tìm video bị CHỮ CHỒNG CHÉO (lớp hook đè phụ đề) và xếp hàng render lại", type: boolean, default: false }
      find_junk: { description: "SOI FILE RÁC trong kho (file tạm, trùng tên, ảnh mồ côi, video hỏng) — giữ nguyên video tốt", type: boolean, default: false }
      doi_ten: { description: "ĐỔI TÊN video cũ về chuẩn (đổi cả chùm mp4+ảnh+sidecar, sửa luôn hàng chờ đăng)", type: boolean, default: false }
      kiem_kho: { description: "KIỂM KHO: đếm số video THẬT trên Drive rồi ghi đè sổ (sửa 'Tổng cộng dồn' bị phồng)", type: boolean, default: false }
      render_lai_cu: { description: "Làm mới video dựng bằng ENGINE CŨ (GUESS đen đầu-cuối, PULSE ngắn/lệch tiếng)", type: boolean, default: false }

concurrency: { group: mm0-wipe-queue, cancel-in-progress: false }

jobs:
  wipe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout AutoPublisher (private)
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.AUTOPUBLISHER_REPO }}
          token: ${{ secrets.AUTOPUBLISHER_TOKEN }}
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: "pip" }
      - run: pip install -r requirements.txt
      - name: Ghi service account key (A + B + C)
        run: |
          echo '${{ secrets.GCP_SA_KEY }}' > /tmp/sa.json
          echo '${{ secrets.GCP_SA_KEY_B }}' > /tmp/sa_b.json
          echo '${{ secrets.GCP_SA_KEY_C }}' > /tmp/sa_c.json
      - name: Wipe
        if: ${{ github.event.inputs.do_wipe == 'true' }}
        # 1 kho token chết không được chặn bước reset sổ phía sau (23/8: ADISONDURHAM invalid_grant
        # -> job dừng ở đây, sổ không được dọn, dashboard vẫn hiện video cũ).
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          GOOGLE_APPLICATION_CREDENTIALS_B: /tmp/sa_b.json
          FIREBASE_PROJECT_ID_B: ${{ secrets.FIREBASE_PROJECT_ID_B }}
          GOOGLE_APPLICATION_CREDENTIALS_C: /tmp/sa_c.json
          FIREBASE_PROJECT_ID_C: ${{ secrets.FIREBASE_PROJECT_ID_C }}
          SHARD_PUBLISH: ${{ vars.SHARD_PUBLISH }}
        run: |
          ARGS=""
          [ "${{ github.event.inputs.dry_run }}" = "true" ] && ARGS="--dry-run"
          python src/wipe_queue.py --scope "${{ github.event.inputs.scope }}" $ARGS
      - name: Checkout render-pipeline
        if: ${{ github.event.inputs.reset_ledger == 'true' || github.event.inputs.fix_dup == 'true' || github.event.inputs.reset_topics == 'true' || github.event.inputs.rebuild_stats == 'true' || github.event.inputs.fix_overlap == 'true' || github.event.inputs.find_junk == 'true' || github.event.inputs.kiem_kho == 'true' || github.event.inputs.render_lai_cu == 'true' || github.event.inputs.doi_ten == 'true' }}
        uses: actions/checkout@v4
        with: { path: rp }
      - name: Dọn bản ghi kho trùng
        if: ${{ github.event.inputs.fix_dup == 'true' }}
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          GOOGLE_APPLICATION_CREDENTIALS_B: /tmp/sa_b.json
          FIREBASE_PROJECT_ID_B: ${{ secrets.FIREBASE_PROJECT_ID_B }}
          FIREBASE_PROJECT_ID_B2: mm0-shard-b2
        run: |
          ARGS=""
          [ "${{ github.event.inputs.dry_run }}" = "true" ] && ARGS="--dry-run"
          python rp/render-pipeline/fix_dup_connections.py $ARGS
      - name: Soi file rác (giữ nguyên video tốt)
        if: ${{ github.event.inputs.find_junk == 'true' }}
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          GOOGLE_APPLICATION_CREDENTIALS_B: /tmp/sa_b.json
          FIREBASE_PROJECT_ID_B: ${{ secrets.FIREBASE_PROJECT_ID_B }}
          FIREBASE_PROJECT_ID_B2: mm0-shard-b2
          HOT_KEY: ${{ secrets.HOT_KEY }}
          HOT_URL: ${{ secrets.HOT_URL }}
          AUTOPUBLISHER_SRC: ${{ github.workspace }}/src
          RENDER_OWNER: ${{ secrets.OWNER_UID }}
        run: |
          cd rp/render-pipeline
          ARGS=""
          [ "${{ github.event.inputs.dry_run }}" != "true" ] && ARGS="--don"
          python find_junk.py $ARGS
      - name: Tìm video chữ chồng chéo -> xếp hàng render lại
        if: ${{ github.event.inputs.fix_overlap == 'true' }}
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          GOOGLE_APPLICATION_CREDENTIALS_B: /tmp/sa_b.json
          FIREBASE_PROJECT_ID_B: ${{ secrets.FIREBASE_PROJECT_ID_B }}
          FIREBASE_PROJECT_ID_B2: mm0-shard-b2
          RENDER_OWNER: ${{ secrets.OWNER_UID }}
          SHARD_KEYS: "1"
        run: |
          cd rp/render-pipeline
          ARGS=""
          [ "${{ github.event.inputs.dry_run }}" != "true" ] && ARGS="--xep-hang"
          python find_overlap_videos.py $ARGS
      - name: Làm mới video dựng bằng engine cũ
        if: ${{ github.event.inputs.render_lai_cu == 'true' }}
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          GOOGLE_APPLICATION_CREDENTIALS_B: /tmp/sa_b.json
          FIREBASE_PROJECT_ID_B: ${{ secrets.FIREBASE_PROJECT_ID_B }}
          FIREBASE_PROJECT_ID_B2: mm0-shard-b2
          RENDER_OWNER: ${{ secrets.OWNER_UID }}
          SHARD_KEYS: "1"
        run: |
          cd rp/render-pipeline
          ARGS=""
          [ "${{ github.event.inputs.dry_run }}" != "true" ] && ARGS="--xep-hang"
          python render_lai_cu.py $ARGS
      - name: Đổi tên video cũ về chuẩn
        if: ${{ github.event.inputs.doi_ten == 'true' }}
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          GOOGLE_APPLICATION_CREDENTIALS_B: /tmp/sa_b.json
          FIREBASE_PROJECT_ID_B: ${{ secrets.FIREBASE_PROJECT_ID_B }}
          FIREBASE_PROJECT_ID_B2: mm0-shard-b2
          GOOGLE_APPLICATION_CREDENTIALS_C: /tmp/sa_c.json
          FIREBASE_PROJECT_ID_C: ${{ secrets.FIREBASE_PROJECT_ID_C }}
          SHARD_PUBLISH: ${{ vars.SHARD_PUBLISH }}
          HOT_KEY: ${{ secrets.HOT_KEY }}
          HOT_URL: ${{ secrets.HOT_URL }}
          AUTOPUBLISHER_SRC: ${{ github.workspace }}/src
          RENDER_OWNER: ${{ secrets.OWNER_UID }}
        run: |
          cd rp/render-pipeline
          ARGS=""
          [ "${{ github.event.inputs.dry_run }}" != "true" ] && ARGS="--that"
          python doi_ten_kho.py $ARGS
      # KIỂM KHO chạy CUỐI: các bước trên có bỏ file vào thùng rác / xếp hàng làm lại, nên phải đếm
      # sau khi kho đã đứng yên thì sổ mới khớp.
      - name: Kiểm kho (số thật từ Drive -> ghi đè sổ)
        if: ${{ github.event.inputs.kiem_kho == 'true' }}
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          GOOGLE_APPLICATION_CREDENTIALS_B: /tmp/sa_b.json
          FIREBASE_PROJECT_ID_B: ${{ secrets.FIREBASE_PROJECT_ID_B }}
          FIREBASE_PROJECT_ID_B2: mm0-shard-b2
          HOT_KEY: ${{ secrets.HOT_KEY }}
          HOT_URL: ${{ secrets.HOT_URL }}
          AUTOPUBLISHER_SRC: ${{ github.workspace }}/src
          RENDER_OWNER: ${{ secrets.OWNER_UID }}
        run: |
          cd rp/render-pipeline
          ARGS=""
          [ "${{ github.event.inputs.dry_run }}" != "true" ] && ARGS="--ghi"
          python kiem_kho.py $ARGS
      - name: Dựng lại sổ đếm
        if: ${{ github.event.inputs.rebuild_stats == 'true' }}
        env:
          GOOGLE_APPLICATION_CREDENTIALS_B: /tmp/sa_b.json
          FIREBASE_PROJECT_ID_B: ${{ secrets.FIREBASE_PROJECT_ID_B }}
          RENDER_OWNER: ${{ secrets.OWNER_UID }}
        run: |
          ARGS=""
          [ "${{ github.event.inputs.dry_run }}" != "true" ] && ARGS="--ghi"
          python rp/render-pipeline/rebuild_stats.py $ARGS
      - name: Reset sổ
        if: ${{ github.event.inputs.reset_ledger == 'true' || github.event.inputs.reset_topics == 'true' }}
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          GOOGLE_APPLICATION_CREDENTIALS_B: /tmp/sa_b.json
          FIREBASE_PROJECT_ID_B: ${{ secrets.FIREBASE_PROJECT_ID_B }}
          FIREBASE_PROJECT_ID_B2: mm0-shard-b2
          RENDER_OWNER: ${{ vars.RENDER_OWNER }}
        run: |
          cd rp/render-pipeline
          ARGS=""
          [ "${{ github.event.inputs.dry_run }}" = "true" ] && ARGS="--dry-run"
          [ "${{ github.event.inputs.reset_topics }}" = "true" ] && ARGS="$ARGS --topics"
          [ "${{ github.event.inputs.reset_ledger }}" != "true" ] && ARGS="$ARGS --only-topics"
          python reset_ledger.py $ARGS
