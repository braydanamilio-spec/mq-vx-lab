name: MM0 Render Factory (18 luồng song song)

# NHÀ MÁY 10 LUỒNG: job "plan" điều phối (gating + health-check + re-render + xuất danh sách kênh),
# rồi job "render" chạy MỖI KÊNH 1 LUỒNG song song (matrix, tối đa 18 — khớp max-parallel dưới +
# MAX_MATRIX trong run_render.py plan_mode(), 2 nơi PHẢI khớp nhau). Video tự rải đều kho Drive.
# Secrets: GCP_SA_KEY, FIREBASE_PROJECT_ID, OWNER_UID, AUTOPUBLISHER_REPO, AUTOPUBLISHER_TOKEN, GEMINI_SYSTEM_PROMPT

on:
  workflow_dispatch:
    inputs:
      force: { description: "FORCE=1 chạy dù pipeline đang tắt", default: "1" }
  schedule:
    - cron: "*/10 * * * *"  # mỗi 10': nhận "Render ngay" nhanh + mở mẻ theo giờ (0/4/8/12/16/20 UTC). Chống trùng bằng last_session_at.

# KHOÁ CHỐNG CHỒNG PHIÊN (19/8, phát hiện thiếu sau sự cố job treo): last_session_at ở tầng app chỉ
# "check rồi mới ghi" — không atomic, 2 lượt trigger gần sát giờ (tick lịch trùng lúc chạy tay) vẫn có
# khe hở race condition cùng lọt gate. Khoá NÀY ở tầng GitHub mới chặn triệt để: lượt trigger mới xếp
# HÀNG ĐỢI (không huỷ phiên đang chạy dở, không chạy chồng) — giống mọi workflow khác đã có sẵn khoá này.
concurrency: { group: mm0-render-cron, cancel-in-progress: false }

jobs:
  # ── ĐIỀU PHỐI: quyết định có chạy không + health-check + re-render + liệt kê kênh ─────────────
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      channels: ${{ steps.plan.outputs.channels }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Python deps (nhẹ - cho gate + plan)
        run: pip install --quiet google-generativeai edge-tts google-cloud-firestore \
             google-api-python-client google-auth pyyaml
      # TỰ KIỂM 10 GIÂY (0 mạng, 0 quota): chạy đúng các đường gọi sản xuất bằng mock — bản push
      # hỏng (shim thiếu chữ ký, thứ tự key sai, đọc-mềm gãy...) FAIL NGAY TẠI ĐÂY, lane không
      # spawn, không đốt gì. Sinh ra từ 3 sự cố 22/8 (system_instruction giết 18/18 luồng...).
      - name: SELFTEST (chặn bản hỏng trước khi spawn 18 luồng)
        run: python render-pipeline/selftest.py
      - name: Service account file
        run: |
          echo '${{ secrets.GCP_SA_KEY }}' > /tmp/sa.json
          echo '${{ secrets.GCP_SA_KEY_B }}' > /tmp/sa_b.json   # shard: render_jobs -> Project B
          echo '${{ secrets.GCP_SA_KEY_C }}' > /tmp/sa_c.json   # đọc hiệu suất video đã đăng -> Project C (feedback loop chọn chủ đề)
      # GATE NHẸ: nhịp 30' không có lệnh -> run=false -> BỎ QUA setup nặng (npm/chrome/ffmpeg) => free hơn.
      - name: Gate (--gate)
        id: gate
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          GOOGLE_APPLICATION_CREDENTIALS_B: /tmp/sa_b.json
          FIREBASE_PROJECT_ID_B: ${{ secrets.FIREBASE_PROJECT_ID_B }}
          FIREBASE_PROJECT_ID_B2: mm0-shard-b2
          PEXELS_KEY: ${{ secrets.PEXELS_KEY }}
          GOOGLE_APPLICATION_CREDENTIALS_C: /tmp/sa_c.json
          FIREBASE_PROJECT_ID_C: ${{ secrets.FIREBASE_PROJECT_ID_C }}
          SHARD_META: ${{ vars.SHARD_META }}
          SHARD_KEYS: ${{ vars.SHARD_KEYS }}   # =1 khi đã copy gemini_keys sang B (render hết đụng hạn mức Project A của publish)   # =1 khi đã migrate config/keys sang B (đọc meta trên B, cách ly A)
          OWNER_UID: ${{ secrets.OWNER_UID }}
          FORCE: ${{ github.event.inputs.force }}
        run: python render-pipeline/run_render.py --gate
      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
        with:
          repository: ${{ secrets.AUTOPUBLISHER_REPO }}
          token: ${{ secrets.AUTOPUBLISHER_TOKEN }}
          path: _autopublisher
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with: { node-version: "22" }
      - name: Cache node_modules (khỏi npm ci lại)
        if: steps.gate.outputs.run == 'true'
        id: cache-node
        uses: actions/cache@v4
        with:
          path: engine-remotion/node_modules
          key: node-modules-${{ hashFiles('engine-remotion/package-lock.json') }}
      - name: Cache Chrome Remotion (khỏi tải lại)
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.remotion
            ~/.cache/remotion
          key: remotion-chrome-${{ hashFiles('engine-remotion/package-lock.json') }}
      - name: Thư viện hệ thống
        if: steps.gate.outputs.run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64 \
            libpango-1.0-0 libcairo2 libatspi2.0-0 || sudo apt-get install -y ffmpeg libasound2
      - name: npm ci (chỉ khi cache MISS)
        if: steps.gate.outputs.run == 'true' && steps.cache-node.outputs.cache-hit != 'true'
        working-directory: engine-remotion
        run: npm ci
      - name: Ensure Chrome (cache -> gần như tức thì)
        if: steps.gate.outputs.run == 'true'
        working-directory: engine-remotion
        run: npx remotion browser ensure
      - name: ĐIỀU PHỐI (--plan) -> xuất danh sách kênh
        id: plan
        if: steps.gate.outputs.run == 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          GOOGLE_APPLICATION_CREDENTIALS_B: /tmp/sa_b.json
          FIREBASE_PROJECT_ID_B: ${{ secrets.FIREBASE_PROJECT_ID_B }}
          FIREBASE_PROJECT_ID_B2: mm0-shard-b2
          PEXELS_KEY: ${{ secrets.PEXELS_KEY }}
          GOOGLE_APPLICATION_CREDENTIALS_C: /tmp/sa_c.json
          FIREBASE_PROJECT_ID_C: ${{ secrets.FIREBASE_PROJECT_ID_C }}
          SHARD_META: ${{ vars.SHARD_META }}
          SHARD_KEYS: ${{ vars.SHARD_KEYS }}   # =1 khi đã copy gemini_keys sang B (render hết đụng hạn mức Project A của publish)   # =1 khi đã migrate config/keys sang B (đọc meta trên B, cách ly A)
          OWNER_UID: ${{ secrets.OWNER_UID }}
          AUTOPUBLISHER_SRC: ${{ github.workspace }}/_autopublisher/src
          GEMINI_SYSTEM_PROMPT: ${{ secrets.GEMINI_SYSTEM_PROMPT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          FORCE: ${{ github.event.inputs.force }}
          PIPELINE_VERSION: "v3"   # v3 = chuẩn 21/8: cảnh hook footage thật, KHÔNG intro/outro, cắt 2-3s, SFX, thumbnail khung hook. Bump theo luật 4c: video v2 (chuẩn cũ) giờ phân biệt được với v3 -> "Dọn bản cũ" trên dashboard xoá đúng đám cũ, không đụng bản mới.
        run: python render-pipeline/run_render.py --plan

  # ── RENDER SONG SONG: mỗi kênh 1 luồng (tối đa 10 cùng lúc), video rải đều 33 kho ────────────
  render:
    needs: plan
    if: needs.plan.outputs.channels != '' && needs.plan.outputs.channels != '[]'
    strategy:
      max-parallel: 18        # trần GitHub free = 20 job/tài khoản; để 18 (dư 2 cho đăng bài).
                              # SỐ LUỒNG và MẺ 10 long/30 short là HAI THỨ KHÁC NHAU: round_long/round_short
                              # (mặc định 10/30) là trần CHO TỪNG KÊNH trong một phiên, không phải tổng phiên.
                              # Nên chạy 18 luồng vẫn đúng mẻ — chỉ là nhiều kênh được phục vụ hơn mỗi vòng.
      fail-fast: false        # 1 kênh lỗi KHÔNG hủy các kênh khác
      matrix:
        channel: ${{ fromJson(needs.plan.outputs.channels) }}
    runs-on: ubuntu-latest
    # 120' chứ KHÔNG 350': job treo giữ KHOÁ concurrency suốt thời gian đó, mọi phiên sau bị huỷ
    # -> dây chuyền đứng. Số liệu thật 20/8: kênh chậm nhất chạy XONG mất 27' (VAULTUSA), phần lớn
    # 6-11'. Đặt 120' = gấp ~4 lần ca xấu nhất (đủ rộng cho kênh long nặng) mà nếu treo thì thiệt
    # hại chỉ 2 tiếng thay vì gần 6 tiếng. Hôm nay 2 job treo từ 13:08 đã nuốt trọn 3 phiên kế.
    timeout-minutes: 165   # 21/8: 1 luồng THẬT = viết 3 kịch bản (+429 chờ) + long 16:9 + 3 short + QC — 120' cắt ngang giữa việc; 150' đủ ca thật, treo vẫn bị chặn bởi watchdog 360s/lệnh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ secrets.AUTOPUBLISHER_REPO }}
          token: ${{ secrets.AUTOPUBLISHER_TOKEN }}
          path: _autopublisher
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Cache node_modules (khỏi npm ci lại)
        id: cache-node
        uses: actions/cache@v4
        with:
          path: engine-remotion/node_modules
          key: node-modules-${{ hashFiles('engine-remotion/package-lock.json') }}
      - name: Cache Chrome Remotion (khỏi tải lại)
        uses: actions/cache@v4
        with:
          path: |
            ~/.remotion
            ~/.cache/remotion
          key: remotion-chrome-${{ hashFiles('engine-remotion/package-lock.json') }}
      - name: Thư viện hệ thống
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64 \
            libpango-1.0-0 libcairo2 libatspi2.0-0 || sudo apt-get install -y ffmpeg libasound2
      - name: Python deps
        run: |
          pip install --quiet google-generativeai google-genai edge-tts google-cloud-firestore \
            google-api-python-client google-auth pyyaml
          # pillow: BẮT BUỘC — still_hook_thumb/photo_score/ensure_yt_thumb đều dùng PIL. Thiếu thì
          # thumbnail khung hook chết lặng ("No module named 'PIL'") và video lên không có ảnh đẹp.
          # Cài Ở LỆNH RIÊNG: gộp vào dòng trên làm pip nổ "resolution-too-deep" (sự cố 20/8).
          pip install --quiet pillow
      - name: npm ci (chỉ khi cache MISS)
        if: steps.cache-node.outputs.cache-hit != 'true'
        working-directory: engine-remotion
        run: npm ci
      - name: Ensure Chrome (cache -> gần như tức thì)
        working-directory: engine-remotion
        run: npx remotion browser ensure
      - name: Service account file
        run: |
          echo '${{ secrets.GCP_SA_KEY }}' > /tmp/sa.json
          echo '${{ secrets.GCP_SA_KEY_B }}' > /tmp/sa_b.json   # shard: render_jobs -> Project B
          echo '${{ secrets.GCP_SA_KEY_C }}' > /tmp/sa_c.json   # đọc hiệu suất video đã đăng -> Project C (feedback loop chọn chủ đề)
      - name: RENDER kênh ${{ matrix.channel }}
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          GOOGLE_APPLICATION_CREDENTIALS_B: /tmp/sa_b.json
          FIREBASE_PROJECT_ID_B: ${{ secrets.FIREBASE_PROJECT_ID_B }}
          FIREBASE_PROJECT_ID_B2: mm0-shard-b2
          PEXELS_KEY: ${{ secrets.PEXELS_KEY }}
          GOOGLE_APPLICATION_CREDENTIALS_C: /tmp/sa_c.json
          FIREBASE_PROJECT_ID_C: ${{ secrets.FIREBASE_PROJECT_ID_C }}
          SHARD_META: ${{ vars.SHARD_META }}
          SHARD_KEYS: ${{ vars.SHARD_KEYS }}   # =1 khi đã copy gemini_keys sang B (render hết đụng hạn mức Project A của publish)   # =1 khi đã migrate config/keys sang B (đọc meta trên B, cách ly A)
          OWNER_UID: ${{ secrets.OWNER_UID }}
          AUTOPUBLISHER_SRC: ${{ github.workspace }}/_autopublisher/src
          GEMINI_SYSTEM_PROMPT: ${{ secrets.GEMINI_SYSTEM_PROMPT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          PIPELINE_VERSION: "v3"   # v3 = chuẩn 21/8: cảnh hook footage thật, KHÔNG intro/outro, cắt 2-3s, SFX, thumbnail khung hook. Bump theo luật 4c: video v2 (chuẩn cũ) giờ phân biệt được với v3 -> "Dọn bản cũ" trên dashboard xoá đúng đám cũ, không đụng bản mới.
        run: python render-pipeline/run_render.py --channel "${{ matrix.channel }}"
      - name: Backup video (nếu chưa đẩy Drive được)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: out-${{ matrix.channel }}
          path: out/*.mp4
          retention-days: 3
          if-no-files-found: ignore
