name: MM0 Migrate Gemini Keys A -> B (một lần, chạy tay)

# Copy bảng gemini_keys từ Project A sang Project B để render KHÔNG còn dùng chung hạn mức đọc
# với publish. Xem lý do đầy đủ: render-pipeline/migrate_keys_to_b.py
#
# CHỈ workflow_dispatch. Chạy dry_run=true trước để xem có bao nhiêu key, rồi mới chạy thật.
# CHẠY KHI QUOTA PROJECT A ĐÃ HỒI (reset ~08:00 UTC) — lúc cạn quota thì chính việc đọc để copy
# cũng thất bại.
#
# Sau khi copy xong, bật cờ để render đọc key từ B:
#   gh variable set SHARD_KEYS --body 1 --repo braydanamilio-spec/mq-vx-lab
# read_keys() có đường lùi (B rỗng -> đọc A) nên bật sớm cũng không gãy gì.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Chạy thử — chỉ đếm, không ghi sang B"
        type: boolean
        default: true

concurrency: { group: mm0-migrate-keys, cancel-in-progress: false }

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Python deps
        run: pip install --quiet google-cloud-firestore google-auth
      - name: Service account A + B
        run: |
          echo '${{ secrets.GCP_SA_KEY }}' > /tmp/sa.json
          echo '${{ secrets.GCP_SA_KEY_B }}' > /tmp/sa_b.json
      - name: Copy gemini_keys A -> B
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          GOOGLE_APPLICATION_CREDENTIALS_B: /tmp/sa_b.json
          FIREBASE_PROJECT_ID_B: ${{ secrets.FIREBASE_PROJECT_ID_B }}
          OWNER_UID: ${{ secrets.OWNER_UID }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" != "false" ]; then ARGS="--dry-run"; fi
          python render-pipeline/migrate_keys_to_b.py $ARGS
