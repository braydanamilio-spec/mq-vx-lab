name: MM0 Đặt lại sổ kho

# 31/8 — SỬA CON SỐ, KHÔNG SỬA KHO.
# Dashboard đọc sổ `kho_that` (D1) và dán nhãn "✓ kho thật". Sổ ấy do bộ lập kế hoạch ghi một
# lần mỗi ngày sau khi quét Drive. Dọn kho xong giữa hai lần ghi thì sổ giữ nguyên số cũ, và
# nhãn "kho thật" khiến không ai nghĩ tới việc nghi ngờ nó.
#
# Lệnh dọn bên repo publish đã tự đóng sổ, NHƯNG repo ấy không có secret HOT_KEY/OWNER_UID —
# chỉ repo này có. Nên đặt nút bấm ở đây: một việc duy nhất, ghi thẳng số vào sổ.
#
# KHÔNG đụng tới file nào trong kho. Nếu số đưa vào sai thì lượt quét Drive kế tiếp sẽ ghi đè
# lại bằng số thật — chỗ tệ nhất có thể xảy ra là dashboard hiển thị sai thêm một ngày.

on:
  workflow_dispatch:
    inputs:
      tong:
        description: "Số video thật trong kho (0 = kho vừa dọn sạch)"
        type: string
        default: "0"
      chi_doc:
        description: "Chỉ ĐỌC trạng thái, không ghi gì"
        type: boolean
        default: true

concurrency:
  group: mm0-dat-so-kho
  cancel-in-progress: false

jobs:
  dat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Ghi sổ kho_that
        env:
          HOT_KEY:   ${{ secrets.HOT_KEY }}
          OWNER_UID: ${{ secrets.OWNER_UID }}
          TONG:      ${{ inputs.tong }}
          CHI_DOC:   ${{ inputs.chi_doc }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from datetime import datetime, timezone
          k, o = os.environ.get("HOT_KEY", ""), os.environ.get("OWNER_UID", "")
          if not k or not o:
              raise SystemExit("❌ thiếu HOT_KEY hoặc OWNER_UID trong secrets của repo này")
          tong = int(os.environ.get("TONG") or 0)
          chi_doc = (os.environ.get("CHI_DOC") or "").lower() == "true"

          # ĐỌC TRƯỚC, LUÔN LUÔN. Con số trên dashboard là thứ anh nhìn thấy, nhưng nó đi qua
          # ba lớp — sổ kho_that, bản ghi D1, rồi phép cộng "đã làm thêm" — và mỗi lớp có thể
          # nói khác nhau. In cả ba ra thì hết phải đoán lớp nào đang sai.
          import urllib.parse as _up
          _base = "https://mm0-connect.adisondurham-ef1.workers.dev"
          try:
              _u = f"{_base}/api/hot-stat?owner={_up.quote(o)}"
              # User-Agent BẮT BUỘC: thiếu thì Cloudflare chặn mã 1010 và trả 403 — giống hệt
              # sai khoá, nên rất dễ đi nhầm hướng. Chính mã worker đã ghi chú điều này ở chỗ
              # khác, mà tôi vẫn quên khi viết request mới.
              _rq = urllib.request.Request(_u, headers={"user-agent": "MM0-Pipeline/1.0"})
              with urllib.request.urlopen(_rq, timeout=25) as r:
                  _d = json.loads(r.read().decode("utf-8", "ignore"))
              print("📊 dashboard đang thấy:")
              for _k2 in ("tong", "tong_nguon", "homnay", "loi", "dangchay"):
                  print(f"     {_k2:12} = {_d.get(_k2)}")
          except Exception as _e:
              print("   ⚠️ đọc trạng thái hụt:", type(_e).__name__, str(_e)[:90])

          if chi_doc:
              raise SystemExit(0)
          url = "https://mm0-connect.adisondurham-ef1.workers.dev/api/hot"
          # Worker nhận {lenh, tham:{...}} — không phải {op, ...}. Gửi sai khuôn thì nó trả
          # 400 chứ không nói thiếu gì, nên phải đọc thẳng mã worker mới biết. Đã trả giá một
          # lượt chạy cho chỗ này.
          body = json.dumps({"lenh": "kho_that_ghi",
                             "tham": {"owner": o, "tong": tong,
                                      "luc": datetime.now(timezone.utc).isoformat()}}).encode()
          req = urllib.request.Request(url, method="POST", data=body, headers={
              "content-type": "application/json", "x-hot-key": k,
              # thiếu User-Agent thì Cloudflare chặn mã 1010 và trả 403 y như sai khoá
              "user-agent": "MM0-Pipeline/1.0"})
          with urllib.request.urlopen(req, timeout=25) as r:
              print("📕 đã ghi sổ kho_that =", tong, "·", r.read().decode("utf-8", "ignore")[:120])
          PY
